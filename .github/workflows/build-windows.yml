# 这是用于构建混合 C++ (MSVC v143) 和 C# (.NET Framework) 项目的 GitHub Actions 工作流程

name: Inkeys 3 Build

on:
  workflow_dispatch:
    inputs:
      validate_release:
        description: 验证 Inkeys/IdtMain.h 中的 #define IDT_RELEASE
        required: false
        type: boolean
        default: true
      sign:
        description: 提交 SignPath 签名（dev 使用测试签名，其他分支使用正式签名）
        required: false
        type: boolean
        default: true
      upload:
        description: 上传 PackageHistory 到 WebDAV
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      signing_policy_slug: ${{ steps.resolve_policy.outputs.signing_policy_slug }}
    steps:
      - shell: pwsh
        run: |
          $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $repoUrl = "$Env:GITHUB_SERVER_URL/$Env:GITHUB_REPOSITORY"

          "## Actions 总结" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "$nowUtc" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "构建仓库: $repoUrl" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "构建分支: ${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "构建提交者: ${{ github.actor }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "验证发布标记: ${{ inputs.validate_release }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "提交签名: ${{ inputs.sign }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "上传 PackageHistory: ${{ inputs.upload }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for '#define IDT_RELEASE'
        if: ${{ inputs.validate_release }}
        id: check_idt_release
        shell: pwsh
        run: |
          $file = "Inkeys/IdtMain.h"
          $found = Select-String -Path $file -Pattern '^#define IDT_RELEASE$'
          if (-not $found) 
          {
            "**没有找到 ``#define IDT_RELEASE``，说明是非发布版本的错误推送，请检查！**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 1
          }
          else
          {
            "成功核实为标记发布版本" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Skip '#define IDT_RELEASE' check
        if: ${{ !inputs.validate_release }}
        shell: pwsh
        run: |
          "已按手动输入跳过发布标记验证" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # 签名配置说明集中在此文件：GitHub Settings → Secrets and variables → Actions → Variables。
      # Repository variables：SIGNPATH_INKEYS_ARTIFACT_CONFIGURATION_SLUG=exe；SIGNPATH_PPTCOM_ARTIFACT_CONFIGURATION_SLUG=pptcom-dll。
      # API token 使用现有 SIGNPATH_API_TOKEN secret；两个 Artifact Configuration 共用现有证书策略。
      # 配置为空或两者 slug 相同则不提交对应请求；签名失败回退，构建及产物上传/下载失败仍使 job 失败。
      - name: 选定两次签名共用的证书策略
        id: resolve_policy
        shell: pwsh
        run: |
          $policy = if ($env:GITHUB_REF_NAME -ieq 'dev') { 'test-signing' } else { 'release-signing' }
          "signing_policy_slug=$policy" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "DLL / EXE 签名策略: $policy" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  pptcom:
    name: PptCOM
    needs: check
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.select_artifact.outputs.artifact_id }}
      tlb_artifact_id: ${{ steps.upload_tlb.outputs.artifact-id }}
      signing_status: ${{ steps.select_pptcom.outputs.signing_status }}

    steps:
    - name: Checkout PptCOM code
      uses: actions/checkout@v7
      # C# 项目不需要拉取 native 子模块或初始化 vcpkg。

    - name: Setup MSBuild
      id: setup_msbuild
      shell: pwsh
      run: |
        $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (!(Test-Path $vswhere))
        {
          throw "找不到 vswhere.exe"
        }

        $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
        if (-not $msbuild)
        {
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
        }
        if (-not $msbuild)
        {
          throw "找不到 MSBuild.exe"
        }

        Split-Path $msbuild -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        $msbuildSearchPath = $env:Path
        Remove-Item Env:PATH -ErrorAction SilentlyContinue
        $env:Path = $msbuildSearchPath
        $env:MSBUILDDISABLENODEREUSE = '1'
        & $msbuild /version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Setup NuGet
      shell: pwsh
      run: |
        $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
        $nugetPath = $null
        if ($nuget)
        {
          $nugetPath = $nuget.Source
        }
        if (-not $nuget)
        {
          $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere)
          {
            $nugetPath = & $vswhere -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe' | Select-Object -First 1
            if ($nugetPath)
            {
              Split-Path $nugetPath -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
        }
        if (-not $nugetPath)
        {
          throw "找不到 nuget.exe"
        }

        & $nugetPath help | Select-Object -First 1

    - name: Setup .NET Framework 4.0
      shell: pwsh
      run: |
        $zipPath = ".\ActionsRes\v4.0.zip"
        $tempPath = ".\temp"
        $targetParent = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
        # 解压 zip 到临时目录
        Expand-Archive -Path $zipPath -DestinationPath $tempPath
        # 创建目标父目录（如果不存在）
        if (!(Test-Path $targetParent)) {
          New-Item -Path $targetParent -ItemType Directory | Out-Null
        }
        # 拷贝整个 v4.0 文件夹到目标父目录下
        Copy-Item -Path "$tempPath\v4.0" -Destination $targetParent -Recurse -Force

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        nuget restore "PptCOM/PptCOM.csproj" -PackagesDirectory "Package"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


    - name: Build PptCOM once
      shell: pwsh
      timeout-minutes: 10
      run: |
        $msbuildSearchPath = $env:Path
        Remove-Item Env:PATH -ErrorAction SilentlyContinue
        $env:Path = $msbuildSearchPath
        $env:MSBUILDDISABLENODEREUSE = '1'
        & '${{ steps.setup_msbuild.outputs.MSBUILD_PATH }}' 'PptCOM/PptCOM.csproj' /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload PptCOM[Unsigned]
      id: upload_pptcom_unsigned
      uses: actions/upload-artifact@v7
      with:
        name: PptCOM[Unsigned]
        path: PptCOM/bin/Release/PptCOM.dll
        if-no-files-found: error
        overwrite: true

    - name: Upload PptCOM-TypeLibrary
      id: upload_tlb
      uses: actions/upload-artifact@v7
      with:
        name: PptCOM-TypeLibrary
        path: PptCOM/bin/Release/PptCOM.tlb
        if-no-files-found: error
        overwrite: true

    - name: Resolve explicit PptCOM artifact configuration
      id: pptcom_config
      shell: pwsh
      env:
        PPTCOM_CONFIG: ${{ vars.SIGNPATH_PPTCOM_ARTIFACT_CONFIGURATION_SLUG }}
        EXE_CONFIG: ${{ vars.SIGNPATH_INKEYS_ARTIFACT_CONFIGURATION_SLUG }}
        SIGN_REQUESTED: ${{ inputs.sign }}
      run: |
        # 两次签名分别读取配置；空值或相同 slug 不提交请求，保留未签名回退。
        $slug = ([string]$env:PPTCOM_CONFIG).Trim()
        $exeSlug = ([string]$env:EXE_CONFIG).Trim()
        $configured = -not [string]::IsNullOrWhiteSpace($slug) -and $slug -ne $exeSlug
        "configured=$($configured.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        if ($configured) {
          "slug=$slug" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } elseif ($env:SIGN_REQUESTED -eq 'true') {
          Write-Host '::warning::请设置 SIGNPATH_PPTCOM_ARTIFACT_CONFIGURATION_SLUG 为 PptCOM DLL 配置 slug，且与 EXE 配置不同；本次 DLL 使用未签名产物。'
        }

    - name: Sign PptCOM DLL
      if: ${{ inputs.sign && steps.pptcom_config.outputs.configured == 'true' }}
      id: sign_pptcom
      timeout-minutes: 30
      continue-on-error: true
      uses: signpath/github-action-submit-signing-request@v1.1
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '95390269-627b-496d-8127-fc47de793284'
        project-slug: 'Inkeys'
        signing-policy-slug: '${{ needs.check.outputs.signing_policy_slug }}'
        artifact-configuration-slug: '${{ steps.pptcom_config.outputs.slug }}'
        github-artifact-id: '${{ steps.upload_pptcom_unsigned.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: './signed-pptcom'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate PptCOM signing result
      id: select_pptcom
      shell: pwsh
      env:
        SIGN_REQUESTED: ${{ inputs.sign }}
        SIGN_OUTCOME: ${{ steps.sign_pptcom.outcome }}
        SIGNING_POLICY: ${{ needs.check.outputs.signing_policy_slug }}
        PPTCOM_CONFIG: ${{ steps.pptcom_config.outputs.slug }}
      run: |
        . .github/scripts/release-artifacts.ps1
        $selected = Select-ReleaseSignature -UnsignedDirectory 'PptCOM/bin/Release' -SignedDirectory 'signed-pptcom' -FileNames @('PptCOM.dll') -SignRequested ($env:SIGN_REQUESTED -eq 'true') -SignOutcome $env:SIGN_OUTCOME -SigningPolicySlug $env:SIGNING_POLICY -ArtifactConfigurationSlug $env:PPTCOM_CONFIG
        "signing_status=$($selected.Status)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "PptCOM DLL 签名: $($selected.Status) — $($selected.Reason)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - name: Upload PptCOM[Signed]
      if: ${{ steps.select_pptcom.outputs.signing_status == 'signed' }}
      id: upload_pptcom_signed
      uses: actions/upload-artifact@v7
      with:
        name: PptCOM[Signed]
        path: signed-pptcom/PptCOM.dll
        if-no-files-found: error
        overwrite: true

    - name: Select exact PptCOM artifact ID
      id: select_artifact
      shell: pwsh
      env:
        SIGNING_STATUS: ${{ steps.select_pptcom.outputs.signing_status }}
        SIGNED_ID: ${{ steps.upload_pptcom_signed.outputs.artifact-id }}
        UNSIGNED_ID: ${{ steps.upload_pptcom_unsigned.outputs.artifact-id }}
      run: |
        $artifactId = if ($env:SIGNING_STATUS -eq 'signed') { $env:SIGNED_ID } else { $env:UNSIGNED_ID }
        if ($artifactId -notmatch '^\d+$') { throw '选定 DLL 的 artifact ID 无效' }
        "artifact_id=$artifactId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "选定 DLL artifact: $artifactId ($env:SIGNING_STATUS)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - name: Delete unsigned DLL only after signed upload
      if: ${{ steps.select_pptcom.outputs.signing_status == 'signed' }}
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UNSIGNED_ID: ${{ steps.upload_pptcom_unsigned.outputs.artifact-id }}
      run: |
        . .github/scripts/release-artifacts.ps1
        Remove-ReleaseArtifact -ArtifactId $env:UNSIGNED_ID -ExpectedName 'PptCOM[Unsigned]'

  build:
    name: Build
    needs: [check, pptcom]
    strategy:
      matrix:
        platform: [Win32, x64, ARM64]
      fail-fast: false
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: 获取环境信息
      id: environmentInfo
      shell: pwsh
      run: |
        $os = Get-ComputerInfo | Select-Object -ExpandProperty OsName
        $ver = Get-ComputerInfo | Select-Object -ExpandProperty OsVersion

        echo "OS=$os" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "OS_VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Setup MSBuild
      id: setup_msbuild
      shell: pwsh
      run: |
        $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (!(Test-Path $vswhere))
        {
          throw "找不到 vswhere.exe"
        }

        $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
        if (-not $msbuild)
        {
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
        }
        if (-not $msbuild)
        {
          throw "找不到 MSBuild.exe"
        }

        Split-Path $msbuild -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        $msbuildSearchPath = $env:Path
        Remove-Item Env:PATH -ErrorAction SilentlyContinue
        $env:Path = $msbuildSearchPath
        $env:MSBUILDDISABLENODEREUSE = '1'
        & $msbuild /version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: 填充 CI/CD 变量
      shell: pwsh
      env:
        STRUCT_BLOCK: |
          struct
          {
            wstring url = L"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
      
            wstring repoUrl = L"{{RepoUrl}}";
            wstring branch = L"${{ github.ref_name }}";
            wstring submitter = L"${{ github.actor }}";
            wstring buildTime = L"{{UTCTIME}}";
      
            wstring buildOS = L"${{ steps.environmentInfo.outputs.OS }}";
            wstring buildOSVersion = L"${{ steps.environmentInfo.outputs.OS_VERSION }}";
            wstring buildRunnerImageOS = L"{{ImageOS}}";
            wstring buildRunnerImageVersion = L"{{ImageVersion}}";
      
            wstring msBuildVersion = L"{{MSBUILDVER}}";
          } settingCICD;
      run: |
        $file = 'Inkeys\Inkeys\UI\Setting\Setting.cpp'
        $content = Get-Content $file
      
        $pattern = '(?ms)^\s*// signal1.*?\s*// signal1'
      
        $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        $imageOS = $Env:ImageOS
        $imageVer = $Env:ImageVersion
        $repoUrl = "$Env:GITHUB_SERVER_URL/$Env:GITHUB_REPOSITORY"

        $msbuildSearchPath = $env:Path
        Remove-Item Env:PATH -ErrorAction SilentlyContinue
        $env:Path = $msbuildSearchPath
        $env:MSBUILDDISABLENODEREUSE = '1'
        $msbuildVersion = (& '${{ steps.setup_msbuild.outputs.MSBUILD_PATH }}' /version) -join "`n"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $msbuildVersionEscaped = $msbuildVersion -replace "`r?`n",'\n'
        $msbuildVersionEscaped = $msbuildVersionEscaped -replace '"','\"'
      
        $structText = $env:STRUCT_BLOCK `
          -replace '\{\{UTCTIME\}\}', $nowUtc `
          -replace '\{\{RepoUrl\}\}', $repoUrl `
          -replace '\{\{ImageOS\}\}', $imageOS `
          -replace '\{\{ImageVersion\}\}', $imageVer `
          -replace '\{\{MSBUILDVER\}\}', $msbuildVersionEscaped
      
        $replacement = $structText -replace "`r*`n", "`r`n"
        $newContent = ($content -join "`r`n") -replace $pattern, $replacement
      
        Set-Content -Path $file -Value $newContent -Encoding utf8

    - name: 写入 RC 产品版本号
      shell: pwsh
      run: |
        $sourceFile = 'Inkeys\IdtMain.cpp'
        $rcFile = 'Inkeys\Inkeys.rc'

        $sourceContent = Get-Content $sourceFile -Raw
        $versionMatch = [regex]::Match($sourceContent, '(?m)^wstring editionVersion = L"([^"]+)";')
        if (-not $versionMatch.Success)
        {
          throw "找不到 editionVersion 变量"
        }

        $editionVersion = $versionMatch.Groups[1].Value
        $buildUtcTime = [DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss')
        $productVersionDisplay = "$editionVersion $buildUtcTime UTC"

        $rcContent = Get-Content $rcFile -Raw
        if ($rcContent -match '(?m)^\s*VALUE\s+"ProductVersion",')
        {
          $rcContent = $rcContent -replace '(?m)^(\s*VALUE\s+"ProductVersion",\s*").*("\r?)$', ('${1}' + $productVersionDisplay + '${2}')
        }
        else
        {
          $rcContent = $rcContent -replace '(?m)^(\s*VALUE\s+"ProductName",.*\r?\n)', ('${1}            VALUE "ProductVersion", "' + $productVersionDisplay + '"' + "`r`n")
        }

        Set-Content -Path $rcFile -Value $rcContent -Encoding utf8
    
    - name: Bootstrap vcpkg
      shell: pwsh
      run: .\vcpkg\bootstrap-vcpkg.bat
      
    - name: Download selected PptCOM DLL
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.pptcom.outputs.artifact_id }}
        merge-multiple: true
        path: Inkeys

    - name: Download matching PptCOM type library
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.pptcom.outputs.tlb_artifact_id }}
        merge-multiple: true
        path: Inkeys

    - name: Build Inkeys
      shell: pwsh
      timeout-minutes: 60
      run: |
        $msbuildSearchPath = $env:Path
        Remove-Item Env:PATH -ErrorAction SilentlyContinue
        $env:Path = $msbuildSearchPath
        $env:MSBUILDDISABLENODEREUSE = '1'
        # Win32 也使用 64 位宿主工具；发布构建明确关闭内嵌 Harness。
        & '${{ steps.setup_msbuild.outputs.MSBUILD_PATH }}' 'Inkeys/Inkeys.vcxproj' /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /p:PreferredToolArchitecture=x64 /p:EnableUi3PresentationHarness=false /verbosity:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify embedded PptCOM DLL and symbols
      shell: pwsh
      run: |
        . .github/scripts/release-artifacts.ps1
        Assert-EmbeddedPptCom -ExecutablePath 'Build/${{ matrix.platform }}/Release/Inkeys.exe' -DllPath 'Inkeys/PptCOM.dll'
        $null = Get-Item -LiteralPath 'Build/${{ matrix.platform }}/Release/Inkeys.pdb' -ErrorAction Stop
    
    - name: Upload exe[unsigned] artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.platform == 'Win32' && 'Inkeys[Unsigned]' || 
                  matrix.platform == 'x64' && 'Inkeys64[Unsigned]' || 
                  matrix.platform == 'ARM64' && 'InkeysArm64[Unsigned]' }}
        path: |
          ${{ (matrix.platform == 'Win32' && './Build/Win32/Release/Inkeys.exe') || 
              (matrix.platform == 'x64' && './Build/x64/Release/Inkeys.exe') || 
              (matrix.platform == 'ARM64' && './Build/ARM64/Release/Inkeys.exe') }}
          ${{ (matrix.platform == 'Win32' && './Build/Win32/Release/Inkeys.pdb') ||
              (matrix.platform == 'x64' && './Build/x64/Release/Inkeys.pdb') ||
              (matrix.platform == 'ARM64' && './Build/ARM64/Release/Inkeys.pdb') }}
          
        if-no-files-found: error
        overwrite: true
  package:
    name: Package
    runs-on: windows-2022
    needs: [check, pptcom, build]
    outputs:
      artifact_id: ${{ steps.upload_package.outputs.artifact-id }}

    steps:
      # 获取版本信息
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 拉取版本代号
        id: softwareDate
        shell: pwsh
        run: |
          $file = 'Inkeys\IdtMain.cpp'

          # 读取所有行，匹配特定前缀
          $line = Get-Content $file | Where-Object { $_ -match '^wstring editionDate = L\"([^\"]+)\";' }
          if (-not $line) 
          {
            Write-Host "找不到 editionDate 变量"
              echo "VALUE='2025====!'" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else
          {
            # 正则提取 editionDate 内容
            if ($line -match '^wstring editionDate = L\"([^\"]+)\";') {
              $date = $matches[1]
              Write-Host "Found editionDate: $date"
              echo "VALUE=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              Write-Host "格式未匹配"
              echo "VALUE='2025====!'" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
      - name: 拉取展示版本号
        id: softwareVersion
        shell: pwsh
        run: |
          $file = 'Inkeys\IdtMain.cpp'
          $content = Get-Content $file -Raw
          $match = [regex]::Match($content, '(?m)^wstring editionVersion = L"([^"]+)";')

          if (-not $match.Success)
          {
            Write-Host "找不到 editionVersion 变量"
            echo "VALUE=0.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else
          {
            $version = $match.Groups[1].Value
            Write-Host "Found editionVersion: $version"
            echo "VALUE=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: 解析通道代号
        id: softwareChannel
        shell: pwsh
        run: |
          $branchName = $Env:GITHUB_REF_NAME
          $channel = $branchName

          if ($branchName -ieq 'main')
          {
            $channel = 'LTS'
          }
          elseif ($branchName -ieq 'canary')
          {
            $channel = 'Canary'
          }

          Write-Host "Resolved channel: $channel"
          echo "VALUE=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - shell: pwsh
        run: |
          "软件展示版本: ${{ steps.softwareVersion.outputs.VALUE }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "软件版本: ${{ steps.softwareDate.outputs.VALUE }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # 环境变量获取
      - name: 获取系统信息
        id: environmentInfo
        shell: pwsh
        run: |
          $os = Get-ComputerInfo | Select-Object -ExpandProperty OsName
          $ver = Get-ComputerInfo | Select-Object -ExpandProperty OsVersion
          
          echo "OS=$os" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "OS_VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 先定位当前 run 的唯一产物，再按精确 ID 下载；重跑不消费旧 ID。
      - name: Resolve native artifact IDs
        id: native_artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .github/scripts/release-artifacts.ps1
          $names = @('Inkeys[Unsigned]', 'Inkeys64[Unsigned]', 'InkeysArm64[Unsigned]')
          $keys = @('win32', 'x64', 'arm64')
          $artifacts = @(Get-ReleaseRunArtifacts -Names $names)
          for ($index = 0; $index -lt $keys.Count; $index++) {
            "$($keys[$index])=$($artifacts[$index].id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Download Inkeys[Unsigned]
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.native_artifacts.outputs.win32 }}
          merge-multiple: true
          path: download/win32
      - name: Download Inkeys64[Unsigned]
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.native_artifacts.outputs.x64 }}
          merge-multiple: true
          path: download/x64
      - name: Download InkeysArm64[Unsigned]
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.native_artifacts.outputs.arm64 }}
          merge-multiple: true
          path: download/arm64
      - name: Download selected PptCOM for package verification
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pptcom.outputs.artifact_id }}
          merge-multiple: true
          path: download/pptcom

      # 打包整理 Package
      - name: Prepare signpath zip folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signatureUpload, signedUpload, packageUpload | Out-Null
          Copy-Item -LiteralPath 'download/win32/Inkeys.exe' -Destination 'signatureUpload/Inkeys.exe' -ErrorAction Stop
          Copy-Item -LiteralPath 'download/x64/Inkeys.exe' -Destination 'signatureUpload/Inkeys64.exe' -ErrorAction Stop
          Copy-Item -LiteralPath 'download/arm64/Inkeys.exe' -Destination 'signatureUpload/InkeysArm64.exe' -ErrorAction Stop
          Copy-Item -LiteralPath 'download/win32/Inkeys.pdb' -Destination 'packageUpload/Inkeys.pdb' -ErrorAction Stop
          Copy-Item -LiteralPath 'download/x64/Inkeys.pdb' -Destination 'packageUpload/Inkeys64.pdb' -ErrorAction Stop
          Copy-Item -LiteralPath 'download/arm64/Inkeys.pdb' -Destination 'packageUpload/InkeysArm64.pdb' -ErrorAction Stop

      - name: Resolve explicit EXE artifact configuration
        id: exe_config
        shell: pwsh
        env:
          EXE_CONFIG: ${{ vars.SIGNPATH_INKEYS_ARTIFACT_CONFIGURATION_SLUG }}
          PPTCOM_CONFIG: ${{ vars.SIGNPATH_PPTCOM_ARTIFACT_CONFIGURATION_SLUG }}
          SIGN_REQUESTED: ${{ inputs.sign }}
        run: |
          $slug = ([string]$env:EXE_CONFIG).Trim()
          $dllSlug = ([string]$env:PPTCOM_CONFIG).Trim()
          $configured = -not [string]::IsNullOrWhiteSpace($slug) -and $slug -ne $dllSlug
          "configured=$($configured.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($configured) {
            "slug=$slug" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($env:SIGN_REQUESTED -eq 'true') {
            Write-Host '::warning::请设置 SIGNPATH_INKEYS_ARTIFACT_CONFIGURATION_SLUG 为 EXE 配置 slug，且与 DLL 配置不同；本次 EXE 使用未签名产物。'
          }

      - name: Upload Signpath[unsigned]
        if: ${{ inputs.sign && steps.exe_config.outputs.configured == 'true' }}
        id: upload_exe_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Signpath[unsigned]
          path: signatureUpload/
          if-no-files-found: error
          overwrite: true

      - name: Sign Inkeys EXEs
        if: ${{ inputs.sign && steps.exe_config.outputs.configured == 'true' }}
        id: sign_inkeys
        timeout-minutes: 30
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '95390269-627b-496d-8127-fc47de793284'
          project-slug: 'Inkeys'
          signing-policy-slug: '${{ needs.check.outputs.signing_policy_slug }}'
          artifact-configuration-slug: '${{ steps.exe_config.outputs.slug }}'
          github-artifact-id: '${{ steps.upload_exe_unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './signed-exe'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Select complete EXE set and verify embedded DLL
        id: select_inkeys
        shell: pwsh
        env:
          SIGN_REQUESTED: ${{ inputs.sign }}
          SIGN_OUTCOME: ${{ steps.sign_inkeys.outcome }}
          SIGNING_POLICY: ${{ needs.check.outputs.signing_policy_slug }}
          EXE_CONFIG: ${{ steps.exe_config.outputs.slug }}
          DLL_SIGNING_STATUS: ${{ needs.pptcom.outputs.signing_status }}
        run: |
          . .github/scripts/release-artifacts.ps1
          $names = @('Inkeys.exe', 'Inkeys64.exe', 'InkeysArm64.exe')
          $folders = @('Inkeys', 'Inkeys64', 'InkeysArm64')
          $selected = Select-ReleaseSignature -UnsignedDirectory 'signatureUpload' -SignedDirectory 'signed-exe' -FileNames $names -SignRequested ($env:SIGN_REQUESTED -eq 'true') -SignOutcome $env:SIGN_OUTCOME -SigningPolicySlug $env:SIGNING_POLICY -ArtifactConfigurationSlug $env:EXE_CONFIG
          for ($index = 0; $index -lt $names.Count; $index++) {
            $target = Join-Path 'signedUpload' $folders[$index]
            New-Item -ItemType Directory -Path $target | Out-Null
            $exePath = Join-Path $target 'Inkeys.exe'
            Copy-Item -LiteralPath (Join-Path $selected.Directory $names[$index]) -Destination $exePath -ErrorAction Stop
            Assert-EmbeddedPptCom -ExecutablePath $exePath -DllPath 'download/pptcom/PptCOM.dll'
          }
          "signing_status=$($selected.Status)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "PptCOM DLL 签名: $env:DLL_SIGNING_STATUS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Inkeys EXE 签名: $($selected.Status) — $($selected.Reason)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Inkeys
        uses: actions/upload-artifact@v7
        with:
          name: Inkeys${{ steps.softwareDate.outputs.VALUE }}
          path: |
            signedUpload\Inkeys\Inkeys.exe
            download\win32\Inkeys.pdb
          if-no-files-found: error
          overwrite: true
      - name: Upload Inkeys64
        uses: actions/upload-artifact@v7
        with:
          name: Inkeys${{ steps.softwareDate.outputs.VALUE }}64
          path: |
            signedUpload\Inkeys64\Inkeys.exe
            download\x64\Inkeys.pdb
          if-no-files-found: error
          overwrite: true
      - name: Upload InkeysArm64
        uses: actions/upload-artifact@v7
        with:
          name: Inkeys${{ steps.softwareDate.outputs.VALUE }}Arm64
          path: |
            signedUpload\InkeysArm64\Inkeys.exe
            download\arm64\Inkeys.pdb

          if-no-files-found: error
          overwrite: true
      - name: Compressed update package 1
        run: |
          Compress-Archive -Path .\signedUpload\Inkeys\Inkeys.exe -DestinationPath .\packageUpload\InkeysUpdate2025====!.zip -CompressionLevel Optimal
      - name: Compressed update package 2
        run: |
          Compress-Archive -Path .\signedUpload\Inkeys64\Inkeys.exe -DestinationPath .\packageUpload\InkeysUpdate2025====!64.zip -CompressionLevel Optimal
      - name: Compressed update package 3
        run: |
          Compress-Archive -Path .\signedUpload\InkeysArm64\Inkeys.exe -DestinationPath .\packageUpload\InkeysUpdate2025====!Arm64.zip -CompressionLevel Optimal
      
      - name: 更新信息编写
        shell: pwsh
        run: |
          $exeFile1 = 'signedUpload\Inkeys\Inkeys.exe'
          $exeFile2 = 'signedUpload\Inkeys64\Inkeys.exe'
          $exeFile3 = 'signedUpload\InkeysArm64\Inkeys.exe'
          $uploadFile1 = 'packageUpload\InkeysUpdate2025====!.zip'
          $uploadFile2 = 'packageUpload\InkeysUpdate2025====!64.zip'
          $uploadFile3 = 'packageUpload\InkeysUpdate2025====!Arm64.zip'
          
          $md5_1 = ((Get-FileHash -Path $exeFile1 -Algorithm MD5   ).Hash).ToLower()
          $md5_2 = ((Get-FileHash -Path $exeFile2 -Algorithm MD5   ).Hash).ToLower()
          $md5_3 = ((Get-FileHash -Path $exeFile3 -Algorithm MD5   ).Hash).ToLower()
          $sha256_1 = ((Get-FileHash -Path $exeFile1 -Algorithm SHA256).Hash).ToLower()
          $sha256_2 = ((Get-FileHash -Path $exeFile2 -Algorithm SHA256).Hash).ToLower()
          $sha256_3 = ((Get-FileHash -Path $exeFile3 -Algorithm SHA256).Hash).ToLower()
          $size1 = (Get-Item $uploadFile1).Length
          $size2 = (Get-Item $uploadFile2).Length
          $size3 = (Get-Item $uploadFile3).Length

          $content = @"
          "${{ steps.softwareChannel.outputs.VALUE }}": {
            "edition_date": "${{ steps.softwareDate.outputs.VALUE }}",
            "edition_code": "",
            "inkeys3": false,
            "hash": {
              "md5": "$md5_1",
              "sha256": "$sha256_1",
              "md5 64": "$md5_2",
              "sha256 64": "$sha256_2",
              "md5 Arm64": "$md5_3",
              "sha256 Arm64": "$sha256_3"
            },
            "path": [
              "https://get.smart-teach.cn/d/Ningbo-S3/shared/AlanCRL/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}.zip",
              "http://home.alan-crl.top/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}.zip",
              "https://vip.123pan.cn/1709404/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}.zip"
            ],
            "path64": [
              "https://get.smart-teach.cn/d/Ningbo-S3/shared/AlanCRL/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}64.zip",
              "http://home.alan-crl.top/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}64.zip",
              "https://vip.123pan.cn/1709404/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}64.zip"
            ],
            "pathArm64": [
              "https://get.smart-teach.cn/d/Ningbo-S3/shared/AlanCRL/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}Arm64.zip",
              "http://home.alan-crl.top/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}Arm64.zip",
              "https://vip.123pan.cn/1709404/Inkeys/Version/InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}Arm64.zip"
            ],
            "size": {
              "file": $size1,
              "file64": $size2,
              "fileArm64": $size3 
            },
            "representation": "Inkeys.exe"
          }
          "@
          Set-Content -Path "packageUpload\update.txt" -Value $content -Encoding UTF8

      - name: Write CI
        shell: pwsh
        run: |
          $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $imageOS = $Env:ImageOS
          $imageVer = $Env:ImageVersion

          $content = @"
          Version: ${{ steps.softwareVersion.outputs.VALUE }}
          Date: ${{ steps.softwareDate.outputs.VALUE }}
          CI/CD: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Branch: ${{ github.ref_name }}
          Submitter: ${{ github.actor }}

          Build OS: ${{ steps.environmentInfo.outputs.OS }}
          Build OS Version: ${{ steps.environmentInfo.outputs.OS_VERSION }}
          Runner ImageOS: $imageOS
          Runner ImageVersion: $imageVer

          Build Time: $nowUtc
          Signing Policy: ${{ needs.check.outputs.signing_policy_slug }}
          PptCOM DLL Signing: ${{ needs.pptcom.outputs.signing_status }}
          Inkeys EXE Signing: ${{ steps.select_inkeys.outputs.signing_status }}
          PptCOM DLL Artifact ID: ${{ needs.pptcom.outputs.artifact_id }}
          PptCOM TLB Artifact ID: ${{ needs.pptcom.outputs.tlb_artifact_id }}
          "@
          Set-Content -Path "packageUpload\ci.txt" -Value $content -Encoding UTF8

      - name: Write Tips
        shell: pwsh
        run: |
          $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $imageOS = $Env:ImageOS
          $imageVer = $Env:ImageVersion

          $content = @"
          软件使用方法：
          1. Inkeys.exe 运行文件放置于一个空的文件夹内（exe 名称不能包含非英文字符）
          2. 双击 Inkeys.exe 运行即可
          
          提示：
          设置桌面快捷方式和开机启动可以进软件选项界面中设置。
          有疑问吐槽建议等等，加Q群618720802一起讨论，或咨询作者QQ2685549821。
          
          -----
          
          How to use the software:
          1. Inkeys.exe runtime file is placed in an empty folder (exe name can not contain non-English characters)
          2. Double-click Inkeys.exe to run.
          
          Tips: 
          Set desktop shortcuts and boot up can be set into the software options interface.
          If you have any questions, comments, suggestions, etc., through the software feedback channel for feedback, or consult the author alan-crl@foxmail.com.
          
          -----
          
          Inkeys${{ steps.softwareDate.outputs.VALUE }}
          CI/CD: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Branch: ${{ github.ref_name }}
          Submitter: ${{ github.actor }}

          Build OS: ${{ steps.environmentInfo.outputs.OS }}
          Build OS Version: ${{ steps.environmentInfo.outputs.OS_VERSION }}
          Runner ImageOS: $imageOS
          Runner ImageVersion: $imageVer

          Build Time: $nowUtc
          "@
          Set-Content -Path "tips.txt" -Value $content -Encoding UTF8

      - name: Prepare Tips
        run: |
          copy tips.txt signedUpload\Inkeys\Tips.txt
          copy tips.txt signedUpload\Inkeys64\Tips.txt
          copy tips.txt signedUpload\InkeysArm64\Tips.txt

      - name: Prepare license notices for release packages
        shell: pwsh
        run: |
          # 完整发布包随附项目与第三方许可；更新包仍仅含待替换的 EXE。
          foreach ($target in @('signedUpload\Inkeys', 'signedUpload\Inkeys64', 'signedUpload\InkeysArm64')) {
            Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $target 'LICENSE') -ErrorAction Stop
            Copy-Item -LiteralPath 'NOTICE' -Destination (Join-Path $target 'NOTICE') -ErrorAction Stop
            Copy-Item -LiteralPath 'ThirdpartyLicenses' -Destination $target -Recurse -ErrorAction Stop
          }

      - name: Compressed release package 1
        run: |
          Compress-Archive -Path .\signedUpload\Inkeys -DestinationPath ".\packageUpload\32=Inkeys2025====!.zip" -CompressionLevel Optimal
      - name: Compressed release package 2
        run: |
          Compress-Archive -Path .\signedUpload\Inkeys64 -DestinationPath ".\packageUpload\64=Inkeys2025====!.zip" -CompressionLevel Optimal
      - name: Compressed release package 3
        run: |
          Compress-Archive -Path .\signedUpload\InkeysArm64 -DestinationPath ".\packageUpload\Arm64=Inkeys2025====!.zip" -CompressionLevel Optimal

      - name: 重命名为最终命名 1
        shell: cmd
        run: |
          rename ".\packageUpload\InkeysUpdate2025====!.zip" "InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\InkeysUpdate2025====!64.zip" "InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}64.zip"
          rename ".\packageUpload\InkeysUpdate2025====!Arm64.zip" "InkeysUpdate${{ steps.softwareDate.outputs.VALUE }}Arm64.zip"

      - name: 重命名为最终命名 2
        if: steps.softwareChannel.outputs.VALUE == 'Dev'
        shell: cmd
        run: |
          rename ".\packageUpload\32=Inkeys2025====!.zip" "开发版本-32位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\64=Inkeys2025====!.zip" "开发版本-64位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\Arm64=Inkeys2025====!.zip" "开发版本-Arm64-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
      - name: 重命名为最终命名 2
        if: steps.softwareChannel.outputs.VALUE == 'Canary'
        shell: cmd
        run: |
          rename ".\packageUpload\32=Inkeys2025====!.zip" "公测版本-32位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\64=Inkeys2025====!.zip" "公测版本-64位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\Arm64=Inkeys2025====!.zip" "公测版本-Arm64-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
      - name: 重命名为最终命名 2
        if: steps.softwareChannel.outputs.VALUE == 'Insider'
        shell: cmd
        run: |
          rename ".\packageUpload\32=Inkeys2025====!.zip" "预览版本-32位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\64=Inkeys2025====!.zip" "预览版本-64位-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
          rename ".\packageUpload\Arm64=Inkeys2025====!.zip" "预览版本-Arm64-Inkeys${{ steps.softwareDate.outputs.VALUE }}.zip"
      - name: 重命名为最终命名 2
        if: steps.softwareChannel.outputs.VALUE == 'LTS' || steps.softwareChannel.outputs.VALUE == 'Main'
        shell: cmd
        run: |
          rename ".\packageUpload\32=Inkeys2025====!.zip" "正式版本-32位-Inkeys${{ steps.softwareVersion.outputs.VALUE }}.zip"
          rename ".\packageUpload\64=Inkeys2025====!.zip" "正式版本-64位-Inkeys${{ steps.softwareVersion.outputs.VALUE }}.zip"
          rename ".\packageUpload\Arm64=Inkeys2025====!.zip" "正式版本-Arm64-Inkeys${{ steps.softwareVersion.outputs.VALUE }}.zip"

      # TEST
      - name: Print file tree
        run: tree /F /A
        shell: cmd

      - name: Upload Package
        id: upload_package
        uses: actions/upload-artifact@v7
        with:
          name: Package
          compression-level: 9
          path: packageUpload/

          if-no-files-found: error
          overwrite: true
      - name: Clean current-run intermediate EXE artifacts
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN32_ID: ${{ steps.native_artifacts.outputs.win32 }}
          X64_ID: ${{ steps.native_artifacts.outputs.x64 }}
          ARM64_ID: ${{ steps.native_artifacts.outputs.arm64 }}
          SIGNING_INPUT_ID: ${{ steps.upload_exe_unsigned.outputs.artifact-id }}
        run: |
          . .github/scripts/release-artifacts.ps1
          # Package 已保存；清理部分完成后失败不能把交付任务变成缺输入的失败重跑。
          try {
            Remove-ReleaseArtifact -ArtifactId $env:WIN32_ID -ExpectedName 'Inkeys[Unsigned]'
            Remove-ReleaseArtifact -ArtifactId $env:X64_ID -ExpectedName 'Inkeys64[Unsigned]'
            Remove-ReleaseArtifact -ArtifactId $env:ARM64_ID -ExpectedName 'InkeysArm64[Unsigned]'
            if ($env:SIGNING_INPUT_ID) {
              Remove-ReleaseArtifact -ArtifactId $env:SIGNING_INPUT_ID -ExpectedName 'Signpath[unsigned]'
            }
          } catch {
            $message = "最终 Package 已保存，EXE 中间产物清理未完成：$($_.Exception.Message)"
            Write-Host "::warning::$message"
            $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }

      - shell: pwsh
        run: |
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "### 构建任务已完成" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Inkeys${{ steps.softwareDate.outputs.VALUE }} 中包含 exe 和对应的 pdb" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Package 中包含各架构的 发布包、更新包、校验文件、ci.txt 和对应的 pdb" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  upload:
    name: Upload
    runs-on: windows-2022
    needs: package
    
    if: ${{ inputs.upload && always() && needs.package.result == 'success' }}
    
    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: packageUpload

      - name: Prepare History Zip
        shell: pwsh
        run: |
          # 重新生成带时间戳的压缩包
          $nowUtc = (Get-Date).ToUniversalTime().ToString("yyyy_MM_ddTHH_mm_ssZ")
          $version = "0.0.0"
          $versionLine = Get-Content ".\packageUpload\ci.txt" | Where-Object { $_ -match '^Version:\s*(.+)$' } | Select-Object -First 1
          if ($versionLine -and $versionLine -match '^Version:\s*(.+)$')
          {
            $version = $matches[1].Trim()
          }
          New-Item -ItemType Directory -Path ".\WebDevUpload" | Out-Null
          Compress-Archive -Path .\packageUpload\* -DestinationPath ".\WebDevUpload\PackageHistory-$version-$nowUtc.zip" -CompressionLevel Optimal

      - name: Install rclone
        shell: pwsh
        run: |
          if ("${{ secrets.WEBDAV_API_TOKEN }}" -ne "")
          {
            Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
            Expand-Archive -Path "rclone.zip" -DestinationPath "." -Force
            $rclonePath = (Get-ChildItem -Path "." -Filter "rclone-*" -Directory | Select-Object -First 1).FullName
            Copy-Item "$rclonePath\rclone.exe" -Destination "C:\Windows\System32\" -Force
          }
          else
          {
            Write-Host "Skip"
          }

      - name: Configure rclone for WebDAV
        shell: pwsh
        run: |
          if ("${{ secrets.WEBDAV_API_TOKEN }}" -ne "")
          {
            $configDir = "$env:APPDATA\rclone"
            if (!(Test-Path $configDir)) {
              New-Item -ItemType Directory -Path $configDir -Force
            }
          
            $obscuredPassword = & rclone obscure "$env:WEBDAV_PASSWORD"

            $configContent = @"
          [webdav]
          type = webdav
          url = $env:WEBDAV_ADDRESS
          vendor = other
          user = $env:WEBDAV_USERNAME
          pass = $obscuredPassword
          "@

            $configContent | Out-File -FilePath "$configDir\rclone.conf" -Encoding UTF8
          }
          else
          {
            Write-Host "Skip"
          }

        env:
          WEBDAV_ADDRESS: ${{ secrets.WEBDAV_API_ADDRESS }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_API_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_API_TOKEN }}

      - name: Upload to WebDAV with rclone
        id: upload_webdav
        timeout-minutes: 120
        continue-on-error: true
        shell: pwsh
        run: |
          if ("${{ secrets.WEBDAV_API_TOKEN }}" -ne "")
          {
            if (!(Test-Path "WebDevUpload")) {
              Write-Host "上传目录 WebDevUpload 不存在"
              exit 1
            }
          
            # 开始上传
            Write-Host "开始上传到 WebDAV..."
            Write-Host "进度将每 10 秒更新一次"
            Write-Host "超时时间: 120 分钟"
            Write-Host "目标路径: /Inkeys/PackageHistory/$Env:GITHUB_REF_NAME"
            Write-Host ""
          
            # 执行 rclone 上传
            $startTime = Get-Date
            try {
              & rclone copy "WebDevUpload/" "webdav:Inkeys/PackageHistory/$Env:GITHUB_REF_NAME/" `
                --progress `
                --transfers 1 `
                --checkers 1 `
                --timeout 30s `
                --contimeout 30s `
                --retries 3 `
                --retries-sleep 5s `
                --low-level-retries 10 `
                --stats 3s `
                --use-mmap `
                --verbose
          
              $exitCode = $LASTEXITCODE
              $endTime = Get-Date
              $duration = $endTime - $startTime
          
              if ($exitCode -eq 0) {
                Write-Host ""
                Write-Host "上传成功完成!"
                Write-Host "总耗时: $($duration.ToString('hh\:mm\:ss'))"
                Write-Host "平均速度已在上方显示"
              } else {
                Write-Host ""
                Write-Host "上传失败，退出代码: $exitCode"
                Write-Host "运行时间: $($duration.ToString('hh\:mm\:ss'))"
                exit $exitCode
              }
            }
            catch {
              Write-Host ""
              Write-Host "上传过程中发生异常: $($_.Exception.Message)"
              exit 1
            } 
          }
          else
          {
            Write-Host "Skip"
          }   

        env:
          WEBDAV_ADDRESS: ${{ secrets.WEBDAV_API_ADDRESS }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_API_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_API_TOKEN }}

      - name: Verify upload
        shell: pwsh
        continue-on-error: true
        run: |
          if ("${{ secrets.WEBDAV_API_TOKEN }}" -ne "")
          {
            Write-Host "验证上传结果..."
          
            # 列出远程目录内容进行验证
            try {
              & rclone ls "webdav:Inkeys/PackageHistory/$Env:GITHUB_REF_NAME/" --human-readable
          
              if ($LASTEXITCODE -eq 0) {
                Write-Host "远程目录列表获取成功"
              } else {
                Write-Host "无法获取远程目录列表，但这不影响上传结果"
              }
            }
            catch {
              Write-Host " 验证步骤失败: $($_.Exception.Message)"
            }
          }
          else
          {
            Write-Host "Skip"
          }  

      - if: steps.upload_webdav.outcome == 'success'
        shell: pwsh
        run: |
          "Package 已经上传至 [Package History 列表](https://www.123912.com/s/duk9-N7QAd)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
