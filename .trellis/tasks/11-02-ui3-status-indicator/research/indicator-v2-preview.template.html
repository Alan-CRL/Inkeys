<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态指示器 v2 预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #111; color: #ddd; display: flex; height: 100vh; }
  #side { width: 300px; padding: 12px 14px; box-sizing: border-box; overflow: auto; background: #1b1b1b; border-right: 1px solid #333; }
  #side h1 { font-size: 15px; margin: 0 0 6px; }
  #side h2 { font-size: 12px; color: #9a9a9a; margin: 14px 0 6px; font-weight: 600; }
  #side p { color: #8a8a8a; margin: 4px 0; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; align-items: center; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #3c3c3c; border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #333; }
  label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  input[type=range] { width: 120px; }
  #stageWrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; }
  #log { font: 11px Consolas, monospace; color: #888; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font: 11px Consolas, monospace; color: #9a9a9a; }
</style>
</head>
<body>
<div id="side">
  <h1>主栏状态指示器 v2</h1>
  <p>按 2026-11-04 决策复刻：圆角矩形、主栏材质、强调色图标/文字/边框、胶囊中心压主按钮边框、紧凑同心弧、灵动收起、遮挡式组合成。尺寸单位为 DIP。</p>

  <h2>外观</h2>
  <div class="row">
    <label><input type="radio" name="theme" value="dark" checked>深色</label>
    <label><input type="radio" name="theme" value="light">浅色</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="expanded" checked>主栏展开</label>
    <label><input type="checkbox" id="flip">倒转（主栏在上方）</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="lighting" checked>光影（光晕）</label>
    <label><input type="checkbox" id="drawing">绘制态（隐藏环）</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="bounds" checked>显示窗口边界</label>
    <label><input type="checkbox" id="displayAccent" checked>强调色按材质校正</label>
  </div>
  <div class="row"><label>动画速率 <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"></label><span id="speedV">1.00</span></div>
  <div class="row"><label>缩放 <input type="range" id="zoom" min="1" max="2.5" step="0.05" value="1.6"></label><span id="zoomV">1.60</span></div>

  <h2>状态源</h2>
  <div class="row">
    <button data-add="ppt">PPT 放映</button>
    <button data-add="wps">WPS 放映</button>
    <button data-add="top">超级置顶</button>
  </div>
  <div class="row">
    <button data-add="ver">新版本（静默下载）</button>
    <button data-add="notify">通知</button>
    <button data-add="long">超长文本</button>
  </div>
  <div class="row">
    <button data-add="random">随机</button>
    <button data-add="five">连加 5 个</button>
    <button data-add="fill">加满 25</button>
  </div>
  <div class="row">
    <button id="retire">注销最新持久</button>
    <button id="clear">清空</button>
    <button id="pause">暂停/继续</button>
  </div>

  <h2>交互</h2>
  <p>点胶囊：提前收起（通知直接退场）。点单个方块：就地重新展开。点多个方块之一：同心弧展开；弧上点选展开胶囊，再点收起；点空白 / 主按钮或 3s 无交互收回。</p>

  <h2>参数</h2>
  <div class="kv" id="params"></div>
  <h2>状态</h2>
  <div id="log"></div>
</div>
<div id="stageWrap"><canvas id="stage"></canvas></div>

<script>
const ICONS = /*ICONS*/{};
const ICON_PATHS = Object.fromEntries(Object.entries(ICONS).map(([k, d]) => [k, new Path2D(d)]));

// ---------- 设计参数（DIP） ----------
const P = {
  mainSize: 80, mainN: 3, barGap: 10, barWidth: 380, barHeight: 80, barRadius: 8,
  windowOutset: 8,               // 原窗口 = 主栏内容外扩（阴影/光影包络）
  capH: 30, capR: 6, capIcon: 18, capGap: 6, capText: 13, capMax: 160,
  stackStep: 4, stackLayers: 3,
  dockSize: 18, dockR: 4, dockIcon: 12, dockStep: 6, dockInset: 14, dockOpacity: 0.5,
  fanSize: 28, fanR: 6, fanIcon: 17, fanGap: 4, fanClear: 6, fanLayerGap: 32, fanSpan: 130,
  ringW: 1.5, glow: 6, breath: 1.6,
  hold: 3.0, fanAutoClose: 3.0,
  enter: 0.42, dismiss: 0.30, exit: 0.28,
  // 弹簧：ω 角频率、ζ 阻尼比（<1 欠阻尼，有轻微过冲）
  morph: { w: 20, z: 0.62 }, flight: { w: 13, z: 0.74 }, slot: { w: 18, z: 0.72 }, bump: { w: 26, z: 0.35 },
  fanSpring: { w: 16, z: 0.7 }, select: { w: 20, z: 0.7 },
  flightDelay: 0.10, flightLift: 12,
};
document.getElementById('params').innerHTML = Object.entries(P).filter(([, v]) => typeof v === 'number')
  .map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('');

// ---------- 工具 ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; t = clamp(t, 0, 1); return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const inBack = t => { const c1 = 1.70158, c3 = c1 + 1; t = clamp(t, 0, 1); return c3 * t * t * t - c1 * t * t; };
const inOutSine = t => (1 - Math.cos(Math.PI * clamp(t, 0, 1))) / 2;
const outSine = t => Math.sin(clamp(t, 0, 1) * Math.PI / 2);

class Spring {
  constructor(x = 0, cfg = P.slot) { this.x = x; this.v = 0; this.t = x; this.cfg = cfg; }
  set(t) { this.t = t; return this; }
  jump(x) { this.x = this.t = x; this.v = 0; return this; }
  step(dt) {
    let rem = dt;
    while (rem > 1e-6) {
      const h = Math.min(rem, 1 / 240); rem -= h;
      const { w, z } = this.cfg;
      const a = -w * w * (this.x - this.t) - 2 * z * w * this.v;
      this.v += a * h; this.x += this.v * h;
    }
  }
  get settled() { return Math.abs(this.x - this.t) < 0.002 && Math.abs(this.v) < 0.02; }
}

// OKLab/OKLCH：按材质校正强调显示色（深底提亮、浅底压暗）。
function srgbToLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function linToSrgb(c) { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(clamp(c, 0, 1) * 255); }
function toOklch(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = srgbToLin(n >> 16 & 255), g = srgbToLin(n >> 8 & 255), b = srgbToLin(n & 255);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
  return [L, Math.hypot(A, B), Math.atan2(B, A)];
}
function fromOklch([L, C, H]) {
  const A = C * Math.cos(H), B = C * Math.sin(H);
  const l = Math.pow(L + 0.3963377774 * A + 0.2158037573 * B, 3);
  const m = Math.pow(L - 0.1055613458 * A - 0.0638541728 * B, 3);
  const s = Math.pow(L - 0.0894841775 * A - 1.2914855480 * B, 3);
  const r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  const g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  const b = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  return [linToSrgb(r), linToSrgb(g), linToSrgb(b)];
}
const accentCache = new Map();
function displayAccent(hex, light) {
  if (!ui.displayAccent) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const key = hex + light;
  if (!accentCache.has(key)) {
    const [L, C, H] = toOklch(hex);
    // 深色主栏底 #181818：L 至少 0.72；浅色雾白底：L 至多 0.52。色度限制避免出界发脏。
    const target = light ? [Math.min(L, 0.52), Math.min(C, 0.17), H] : [Math.max(L, 0.72), Math.min(C, 0.16), H];
    accentCache.set(key, fromOklch(target));
  }
  return accentCache.get(key);
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function superPoints(cx, cy, a, b, n, count = 192) {
  // 从顶部中点顺时针，与 D2D 进度段起点一致。
  const pts = [];
  for (let i = 0; i <= count; i++) {
    const t = -Math.PI / 2 + 2 * Math.PI * i / count;
    const c = Math.cos(t), s = Math.sin(t);
    pts.push([cx + a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), cy + b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]);
  }
  return pts;
}
function superRadius(theta, a, n) {
  const c = Math.abs(Math.cos(theta)), s = Math.abs(Math.sin(theta));
  return a / Math.pow(Math.pow(c, n) + Math.pow(s, n), 1 / n);
}
function superEdgeY(dx, a, n) { return a * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(dx) / a, n)), 1 / n); }

// ---------- UI 状态 ----------
const ui = { theme: 'dark', expanded: true, flip: false, lighting: true, drawing: false, bounds: true, displayAccent: true, speed: 1, zoom: 1.6 };
document.querySelectorAll('input[name=theme]').forEach(r => r.onchange = () => ui.theme = r.value);
for (const id of ['expanded', 'flip', 'lighting', 'drawing', 'bounds', 'displayAccent'])
  document.getElementById(id).onchange = e => { ui[id] = e.target.checked; accentCache.clear(); };
document.getElementById('speed').oninput = e => { ui.speed = +e.target.value; document.getElementById('speedV').textContent = ui.speed.toFixed(2); };
document.getElementById('zoom').oninput = e => { ui.zoom = +e.target.value; document.getElementById('zoomV').textContent = ui.zoom.toFixed(2); };

const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
const measureCtx = document.createElement('canvas').getContext('2d');
const FONT = '"Microsoft YaHei UI", "Segoe UI", sans-serif';
function textWidth(t) { measureCtx.font = `bold ${P.capText}px ${FONT}`; return measureCtx.measureText(t).width; }

// ---------- 几何：主栏 ----------
function geometry() {
  const Z = ui.zoom, W = canvas.width / devicePixelRatio / Z, H = canvas.height / devicePixelRatio / Z;
  const totalW = P.mainSize + (ui.expanded ? P.barGap + P.barWidth : 0);
  const left = (W - totalW) / 2;
  const cy = ui.flip ? 120 : H - 140;
  const main = { cx: left + P.mainSize / 2, cy, a: P.mainSize / 2 };
  const bar = ui.expanded ? { x: left + P.mainSize + P.barGap, y: cy - P.barHeight / 2, w: P.barWidth, h: P.barHeight } : null;
  const content = { l: left, t: cy - P.mainSize / 2, r: left + totalW, b: cy + P.mainSize / 2 };
  const base = { l: content.l - P.windowOutset, t: content.t - P.windowOutset, r: content.r + P.windowOutset, b: content.b + P.windowOutset };
  const dir = ui.flip ? 1 : -1;                      // 胶囊/方块向外方向
  return { W, H, main, bar, base, dir, edgeY: ui.flip ? cy + P.mainSize / 2 : cy - P.mainSize / 2 };
}

// ---------- 模型 ----------
const SOURCES = {
  ppt: { text: '放映模式', color: '#C43E1C', icon: 'barStatusSlideshow', life: 'persist' },
  wps: { text: '放映模式', color: '#E8352B', icon: 'barStatusSlideshow', life: 'persist' },
  top: { text: '超级置顶', color: '#1F4FB8', icon: 'barStatusPin', life: 'persist' },
  ver: { text: '新版本', color: '#2EA043', icon: 'barStatusNewVersion', life: 'persist', progress: true },
  notify: { text: '已保存', color: '#008FAD', icon: 'barStatusBell', life: 'notify' },
  long: { text: '这是一条用于检查三秒内完整滚动的超长状态提示', color: '#9B59B6', icon: 'barStatusInfo', life: 'persist' },
};
const RANDOM_COLORS = ['#C43E1C', '#E8352B', '#1F4FB8', '#2EA043', '#9B59B6', '#E09D12', '#008FAD', '#CC4780'];
const RANDOM_TEXTS = ['OK', '放映模式', '超级置顶', 'Download', '这是一条用于检查三秒内完整滚动的超长状态提示', 'A very long status message to exercise scrolling'];
const RANDOM_ICONS = Object.keys(ICONS);

let entries = [], serial = 0, dockSerial = 0, now = 0;
const fan = { open: false, p: new Spring(0, P.fanSpring), deadline: 0, selected: 0, frozen: [] };
const ring = { owner: 0, color: '#2EA043', op: new Spring(0, { w: 14, z: 1 }), colorMix: 1, from: '#2EA043' };
let pointer = { x: -1, y: -1, down: 0, hover: 0 };

function add(kind) {
  if (entries.filter(e => !e.leaving).length >= 25) return;
  let spec;
  if (kind === 'random') {
    spec = { text: RANDOM_TEXTS[Math.random() * RANDOM_TEXTS.length | 0], color: RANDOM_COLORS[Math.random() * 8 | 0],
      icon: RANDOM_ICONS[Math.random() * RANDOM_ICONS.length | 0], life: Math.random() < 0.25 ? 'notify' : 'persist', progress: Math.random() < 0.3 };
  } else spec = { ...SOURCES[kind] };
  const e = {
    id: ++serial, ...spec, textW: textWidth(spec.text), phase: 'expanded', born: now,
    appear: 0, holding: false, holdEnd: 0, holdStart: 0,
    stack: new Spring(queueLength(), P.slot),
    width: new Spring(0, P.morph), flight: new Spring(0, P.flight), bump: new Spring(1, P.bump),
    slot: new Spring(0, P.slot), landed: false, flightStart: 0, vanish: 0, select: new Spring(0, P.select),
    progress: spec.progress ? 0 : -1, progressStart: now, presence: 1,
    stackW: new Spring(0, P.slot),
  };
  e.fullW = capsuleWidth(e);
  e.width.jump(e.fullW);
  const q0 = expandedQueue()[0];
  e.stackW.jump(q0 ? q0.stackW.x : e.fullW);
  entries.push(e);
}
function capsuleWidth(e) {
  const pad = (P.capH - 17) / 2;   // 同底栏指示器：高度扣除文字高度后的余量作内边距
  return clamp(pad + P.capIcon + P.capGap + e.textW + pad + 2, P.capH, P.capMax);
}
function textClipWidth(e) { const pad = (P.capH - 17) / 2; return e.fullW - pad * 2 - P.capIcon - P.capGap - 2; }
const expandedQueue = () => entries.filter(e => e.phase === 'expanded');
const queueLength = () => expandedQueue().length;
const docked = () => entries.filter(e => e.phase === 'docked' || (e.phase === 'collapsing' && e.landed) || e.phase === 'reexpand');
function dockOrder() {
  // 新的在右（slot 0），旧的依次向左。
  return entries.filter(e => e.dockSerial && !(e.phase === 'exiting' && e.vanish >= 1)).sort((a, b) => b.dockSerial - a.dockSerial);
}

function collapse(e) {
  if (e.phase !== 'expanded' && e.phase !== 'reexpand') return;
  if (e.life === 'notify') { e.phase = 'dismissing'; e.vanish = 0; return; }
  e.phase = 'collapsing'; e.width.set(P.capH); e.flightStart = now + P.flightDelay / ui.speed; e.flight.jump(0); e.landed = false;
  e.wasReexpand = !!e.reexpandFrom;
}
function retireNewest() {
  const list = entries.filter(e => e.life === 'persist' && e.phase !== 'exiting').sort((a, b) => b.id - a.id);
  if (list[0]) { list[0].phase = 'exiting'; list[0].vanish = 0; }
}

// ---------- 推进 ----------
function advance(dt) {
  const sdt = dt * ui.speed;
  now += dt;
  // 队首计时：最前者到达位置后开始 3s
  const q = expandedQueue();
  q.forEach((e, i) => { e.stack.set(i); e.stackW.set(i === 0 ? e.fullW : q[0].fullW); });
  const front = q[0];
  if (front && !front.holding && front.stack.x < 0.05 && front.appear > 0.6) { front.holding = true; front.holdStart = now; front.holdEnd = now + P.hold; }
  for (const e of entries) {
    e.appear = Math.min(1, e.appear + sdt / P.enter);
    e.stack.step(sdt); e.stackW.step(sdt); e.bump.step(sdt); e.select.step(sdt);
    if (e.phase === 'expanded' && e.holding && now >= e.holdEnd) collapse(e);
    if (e.phase === 'reexpand') {
      e.width.step(sdt); e.flight.step(sdt);
      if (e.holding && now >= e.holdEnd) collapse(e);
    }
    if (e.phase === 'collapsing') {
      e.width.step(sdt);
      if (now >= e.flightStart) { e.flight.set(1); e.flight.step(sdt); }
      if (!e.landed && e.flight.x >= 0.97) {
        e.landed = true;
        if (!e.dockSerial) e.dockSerial = ++dockSerial;
        e.bump.v = 1.6;    // 着陆轻弹
      }
      if (e.landed && e.flight.settled && e.width.settled) { e.phase = 'docked'; e.reexpandFrom = null; }
    }
    if (e.phase === 'dismissing' || e.phase === 'exiting') e.vanish = Math.min(1, e.vanish + sdt / (e.phase === 'dismissing' ? P.dismiss : P.exit));
    if (e.progress >= 0 && e.progress < 1) e.progress = clamp((now - e.progressStart) / 6, 0, 1);
    if (e.progress >= 1 && !e.progressDoneAt) e.progressDoneAt = now;
  }
  entries = entries.filter(e => !((e.phase === 'dismissing' || e.phase === 'exiting') && e.vanish >= 1));
  // 停靠槽：只有已着陆者占位，着陆瞬间其余方块才让位。
  dockOrder().filter(e => e.landed || e.phase === 'docked' || e.phase === 'reexpand' || e.phase === 'exiting')
    .forEach((e, i) => e.slot.set(i));
  for (const e of entries) e.slot.step(sdt);
  // 同心弧
  const dockCount = entries.filter(e => e.phase === 'docked').length;
  if (fan.open && (dockCount < 2 || now >= fan.deadline)) closeFan();
  fan.p.step(sdt);
  // 环：随最前可读者
  const ringOwner = front && front.holding ? front : null;
  if (ringOwner && ringOwner.id !== ring.owner) { ring.from = currentRingColor(); ring.color = ringOwner.color; ring.colorMix = 0; ring.owner = ringOwner.id; }
  ring.colorMix = Math.min(1, ring.colorMix + sdt / 0.3);
  ring.op.set(ringOwner && !ui.drawing ? 1 : 0); ring.op.step(sdt);
  if (!ringOwner && ring.op.x < 0.01) ring.owner = 0;
}
function currentRingColor() { return ring.colorMix >= 1 ? ring.color : ring.color; }
function openFan() { fan.open = true; fan.deadline = now + P.fanAutoClose; fan.p.set(1); fan.selected = 0;
  fan.frozen = dockOrder().filter(e => e.phase === 'docked').map(e => e.id); }
function closeFan() { fan.open = false; fan.p.set(0); for (const e of entries) e.select.set(0); fan.selected = 0; }

// ---------- 布局：每帧输出绘制项（自下而上） ----------
function layout(G) {
  const items = [];
  const L = ui.theme === 'light';
  const cx = G.main.cx, edgeY = G.edgeY, dir = G.dir, a = G.main.a;
  // 停靠位：竖直中心落在超椭圆边框上、靠右端；夹入原窗口
  const dockX0 = cx + a - P.dockInset;
  const dockEdgeY = G.main.cy + dir * superEdgeY(dockX0 - cx, a, P.mainN);
  const dockPoint = slot => {
    let x = dockX0 - slot * P.dockStep, y = dockEdgeY;
    x = Math.max(x, G.base.l + P.dockSize / 2);
    y = dir < 0 ? Math.max(y, G.base.t + P.dockSize / 2) : Math.min(y, G.base.b - P.dockSize / 2);
    return [x, y];
  };
  // 同心弧位置（对称于正上 / 倒转正下）
  const fanIds = fan.frozen.length ? fan.frozen : dockOrder().filter(e => e.phase === 'docked').map(e => e.id);
  const R0 = superRadius(50 * Math.PI / 180, a, P.mainN) + P.fanClear + P.fanSize / 2;

  if (now < flashUntil) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(20, 20, 220, 30); ctx.fillStyle = '#fff'; ctx.font = `13px ${FONT}`; ctx.fillText(flashText, 30, 40); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
add('ppt');
</script>
