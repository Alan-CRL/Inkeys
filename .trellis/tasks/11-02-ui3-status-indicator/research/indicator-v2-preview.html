<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态指示器 v2 预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #111; color: #ddd; display: flex; height: 100vh; }
  #side { width: 300px; padding: 12px 14px; box-sizing: border-box; overflow: auto; background: #1b1b1b; border-right: 1px solid #333; }
  #side h1 { font-size: 15px; margin: 0 0 6px; }
  #side h2 { font-size: 12px; color: #9a9a9a; margin: 14px 0 6px; font-weight: 600; }
  #side p { color: #8a8a8a; margin: 4px 0; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; align-items: center; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #3c3c3c; border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #333; }
  label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  input[type=range] { width: 120px; }
  #stageWrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; }
  #log { font: 11px Consolas, monospace; color: #888; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font: 11px Consolas, monospace; color: #9a9a9a; }
</style>
</head>
<body>
<div id="side">
  <h1>主栏状态指示器 v2</h1>
  <p>按 2026-11-04 决策复刻：圆角矩形、主栏材质、强调色图标/文字/边框、胶囊中心压主按钮边框、紧凑同心弧、灵动收起、遮挡式组合成。尺寸单位为 DIP。</p>

  <h2>外观</h2>
  <div class="row">
    <label><input type="radio" name="theme" value="dark" checked>深色</label>
    <label><input type="radio" name="theme" value="light">浅色</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="expanded" checked>主栏展开</label>
    <label><input type="checkbox" id="flip">倒转（主栏在上方）</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="lighting" checked>光影（光晕）</label>
    <label><input type="checkbox" id="drawing">绘制态（隐藏环）</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="bounds" checked>显示窗口边界</label>
    <label><input type="checkbox" id="displayAccent" checked>强调色按材质校正</label>
  </div>
  <div class="row"><label>动画速率 <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"></label><span id="speedV">1.00</span></div>
  <div class="row"><label>缩放 <input type="range" id="zoom" min="1" max="2.5" step="0.05" value="1.6"></label><span id="zoomV">1.60</span></div>

  <h2>状态源</h2>
  <div class="row">
    <button data-add="ppt">PPT 放映</button>
    <button data-add="wps">WPS 放映</button>
    <button data-add="top">超级置顶</button>
  </div>
  <div class="row">
    <button data-add="ver">新版本（静默下载）</button>
    <button data-add="notify">通知</button>
    <button data-add="long">超长文本</button>
  </div>
  <div class="row">
    <button data-add="random">随机</button>
    <button data-add="five">连加 5 个</button>
    <button data-add="fill">加满 25</button>
  </div>
  <div class="row">
    <button id="retire">注销最新持久</button>
    <button id="clear">清空</button>
    <button id="pause">暂停/继续</button>
  </div>

  <h2>交互</h2>
  <p>点胶囊：提前收起（通知直接退场）。点单个方块：就地重新展开。点多个方块之一：同心弧展开；弧上点选展开胶囊，再点收起；点空白 / 主按钮或 3s 无交互收回。</p>

  <h2>参数</h2>
  <div class="kv" id="params"></div>
  <h2>状态</h2>
  <div id="log"></div>
</div>
<div id="stageWrap"><canvas id="stage"></canvas></div>

    if (e.phase === 'exiting') { s *= 1 - 0.5 * inOutSine(e.vanish); opacity *= 1 - inOutSine(e.vanish); }
    const sel = e.select.x;
    if (sel > 0.001) {
      // 弧上选中：以方块为中心左右展开为胶囊
      const w = lerp(size, e.fullW, clamp(sel, 0, 1.08));
      const rect = { x: x - w / 2, y: y - lerp(size, P.capH, clamp(sel, 0, 1)) / 2, w, h: lerp(size, P.capH, clamp(sel, 0, 1)), r: lerp(r, P.capR, clamp(sel, 0, 1)) };
      const cxL = clamp(rect.x, 4, G.W - rect.w - 4) - rect.x; rect.x += cxL;
      items.push({ ...base, kind: 'capsule', rect, scale: 1, pivot: [x, y], opacity: 1, textOpacity: smooth(0.3, 1, sel), z: 600,
        front: true, scroll: scrollOffset(e, now - (e.selectStart || now)), hit: 'fan', overflow: true, iconLeft: true });
      continue;
    }
    items.push({ ...base, kind: 'tile', cx: x, cy: y, size: size * s, r, icon, opacity, z, hit: fp > 0.5 ? 'fan' : 'dock', overflow: fp > 0.001,
      hover: pointer.hover === e.id, pressed: pointer.down === e.id });
  }
  items.sort((p, q) => p.z - q.z);
  return items;
}
function scrollOffset(e, elapsed) {
  const clip = textClipWidth(e), over = e.textW - clip;
  if (over <= 0) return 0;
  const t = elapsed !== undefined ? elapsed : (e.holding ? now - e.holdStart : 0);
  const travel = P.hold - P.enter - 0.6;
  return over * clamp((t - 0.3) / travel, 0, 1);
}

// ---------- 绘制 ----------
function material(L) {
  return L ? { fill: [251, 251, 251], fillA: 0.92, frame: [139, 139, 139], frameA: 0.18, text: [26, 26, 26], hover: [0, 0, 0, 0.06], shadow: 'rgba(0,0,0,0.08)' }
           : { fill: [24, 24, 24], fillA: 0.8, frame: [255, 255, 255], frameA: 0.18, text: [255, 255, 255], hover: [255, 255, 255, 0.10], shadow: null };
}
function itemShape(it) {
  if (it.kind === 'tile') { const s = it.size; return { x: it.cx - s / 2, y: it.cy - s / 2, w: s, h: s, r: it.r * (s / Math.max(1, it.size)) }; }
  const r = it.rect, s = it.scale, px = it.pivot[0], py = it.pivot[1];
  return { x: px + (r.x - px) * s, y: py + (r.y - py) * s, w: r.w * s, h: r.h * s, r: r.r * s };
}
function drawBackdrop(G) {
  const g = ctx.createLinearGradient(0, 0, G.W, G.H);
  g.addColorStop(0, '#3a5a7a'); g.addColorStop(0.5, '#7b6a8f'); g.addColorStop(1, '#c79a6a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(40, 40, G.W * 0.45, G.H * 0.35);
  ctx.fillStyle = '#222'; ctx.font = `600 22px ${FONT}`; ctx.fillText('课件内容 / 桌面', 60, 80);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = `hsl(${i * 60},60%,55%)`; ctx.fillRect(G.W * 0.55 + i * 40, 60 + (i % 2) * 40, 30, G.H * 0.7); }
}
function drawMainBar(G, M) {
  const { main, bar } = G;
  if (bar) {
    ctx.beginPath(); rrPath(ctx, bar.x, bar.y, bar.w, bar.h, P.barRadius);
    ctx.fillStyle = rgba(M.fill, M.fillA); ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = rgba(M.frame, M.frameA); ctx.stroke();
    // 占位按钮（判断弧遮挡观感）
    for (let i = 0; i < 5; i++) {
      const bx = bar.x + 10 + i * 75;
      ctx.beginPath(); rrPath(ctx, bx, bar.y + 5, 70, 70, 4); ctx.fillStyle = rgba(M.text, 0.05); ctx.fill();
      ctx.beginPath(); ctx.arc(bx + 35, bar.y + 30, 11, 0, 7); ctx.fillStyle = rgba(M.text, 0.7); ctx.fill();
      ctx.fillStyle = rgba(M.text, 0.85); ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(['选择', '画笔', '橡皮', '更多', '白板'][i], bx + 35, bar.y + 62); ctx.textAlign = 'left';
    }
  }
  const pts = superPoints(main.cx, main.cy, main.a, main.a, P.mainN);
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  const mainLight = ui.theme === 'light' && ui.expanded;
  const MM = material(mainLight);
  ctx.fillStyle = rgba(MM.fill, mainLight ? MM.fillA : 0.6 + (ui.expanded ? 0.2 : 0)); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(MM.frame, MM.frameA); ctx.stroke();
  // logo 占位
  ctx.beginPath(); ctx.arc(main.cx, main.cy, 16, 0, 7); ctx.fillStyle = mainLight ? '#00a99d' : '#58ffec'; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
  return pts;
}
function strokeGlow(color, width, draw) {
  if (ui.lighting) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = P.glow * ui.zoom * devicePixelRatio; ctx.lineWidth = width; ctx.strokeStyle = color;
    draw(); ctx.globalAlpha *= 0.7; draw(); ctx.restore();
  }
  ctx.lineWidth = width; ctx.strokeStyle = color; draw();
}
function drawRing(G, pts) {
  const L = ui.theme === 'light' && ui.expanded;
  // 进度环
  for (const e of entries) {
    if (e.progress < 0 || ui.drawing) continue;
    const doneFade = e.progressDoneAt ? 1 - clamp((now - e.progressDoneAt - P.hold) / 0.3, 0, 1) : 1;
    if (doneFade <= 0) continue;
    const c = rgba(displayAccent(e.color, L), doneFade * (e.progress >= 1 ? 0.75 + 0.25 * Math.cos(now * 2 * Math.PI / P.breath) : 1));
    const n = Math.max(2, Math.round((pts.length - 1) * e.progress));
    strokeGlow(c, P.ringW, () => { ctx.beginPath(); ctx.lineCap = 'round'; for (let i = 0; i <= n; i++) i ? ctx.lineTo(...pts[i]) : ctx.moveTo(...pts[i]); ctx.stroke(); });
    return;
  }
  if (ring.op.x <= 0.01) return;
  const breath = 0.55 + 0.45 * (0.5 + 0.5 * Math.cos(now * 2 * Math.PI / P.breath));
  const c = rgba(displayAccent(ring.color, L), clamp(ring.op.x, 0, 1) * breath);
  strokeGlow(c, P.ringW, () => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke(); });
}
function drawIcon(name, x, y, size, color) {
  const p = ICON_PATHS[name]; if (!p) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 24, size / 24); ctx.fillStyle = color; ctx.fill(p, 'evenodd'); ctx.restore();
}
function drawItem(it, M) {
  const s = itemShape(it);
  if (s.w <= 0.5 || it.opacity <= 0.002) return;
  const pressScale = it.pressed ? 0.95 : 1;
  ctx.save();
  ctx.globalAlpha = clamp(it.opacity, 0, 1);
  if (pressScale !== 1) { const cx = s.x + s.w / 2, cy = s.y + s.h / 2; ctx.translate(cx, cy); ctx.scale(pressScale, pressScale); ctx.translate(-cx, -cy); }
  if (M.shadow) { ctx.save(); ctx.shadowColor = M.shadow; ctx.shadowBlur = 6 * ui.zoom * devicePixelRatio; ctx.shadowOffsetY = 2 * ui.zoom * devicePixelRatio;
    ctx.beginPath(); rrPath(ctx, s.x, s.y, s.w, s.h, s.r); ctx.fillStyle = rgba(M.fill, M.fillA); ctx.fill(); ctx.restore(); }
  ctx.beginPath(); rrPath(ctx, s.x, s.y, s.w, s.h, s.r); ctx.fillStyle = rgba(M.fill, M.fillA); ctx.fill();
  if (it.hover) { ctx.fillStyle = `rgba(${M.hover.join(',')})`; ctx.fill(); }
  // 1 DIP 强调色边框（主栏同粗细）；光影开启时带柔和光晕
  ctx.beginPath(); rrPath(ctx, s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1, Math.max(0, s.r - 0.5));
  if (ui.lighting) { ctx.save(); ctx.shadowColor = rgba(it.accent, 0.55); ctx.shadowBlur = 4 * ui.zoom * devicePixelRatio; ctx.lineWidth = 1; ctx.strokeStyle = rgba(it.accent, 0.9); ctx.stroke(); ctx.restore(); }
  else { ctx.lineWidth = 1; ctx.strokeStyle = rgba(it.accent, 0.9); ctx.stroke(); }
  const color = rgba(it.accent, 1);
  if (it.kind === 'tile') {
    const isz = it.icon * (s.w / Math.max(1, it.size));
    drawIcon(it.e.icon, s.x + (s.w - isz) / 2, s.y + (s.h - isz) / 2, isz, color);
  } else {
    const sc = s.h / P.capH, pad = (P.capH - 17) / 2 * sc;
    const isz = P.capIcon * sc;
    const iconX = s.x + (P.capH * sc - isz) / 2;
    drawIcon(it.e.icon, iconX, s.y + (s.h - isz) / 2, isz, color);
    if (it.textOpacity > 0.01) {
      // 文字：裁入圆角矩形内侧；滚动时两端渐隐，不再有硬矩形切口
      const tx0 = s.x + pad + isz + P.capGap * sc, tx1 = s.x + s.w - pad;
      const clipW = Math.max(0, tx1 - tx0);
      const fullClip = textClipWidth(it.e) * sc;
      const overflow = it.e.textW * sc > fullClip + 0.5;
      ctx.save();
      ctx.beginPath(); rrPath(ctx, s.x + 1, s.y + 1, s.w - 2, s.h - 2, Math.max(0, s.r - 1)); ctx.clip();
      ctx.beginPath(); ctx.rect(tx0 - 2, s.y, clipW + 4, s.h); ctx.clip();
      const off = document.createElement('canvas');
      const dpr = devicePixelRatio * ui.zoom;
      off.width = Math.ceil((clipW + 4) * dpr); off.height = Math.ceil(s.h * dpr);
      const o = off.getContext('2d'); o.scale(dpr, dpr);
      o.font = `bold ${P.capText * sc}px ${FONT}`; o.textBaseline = 'middle'; o.fillStyle = color;
      const textX = overflow ? 2 - it.scroll * sc : 2 + Math.max(0, (fullClip - it.e.textW * sc) / 2);
      o.fillText(it.e.text, textX, s.h / 2 + 0.5);
      if (overflow) {
        o.globalCompositeOperation = 'destination-in';
        const f = 8 * sc / (clipW + 4);
        const g = o.createLinearGradient(0, 0, clipW + 4, 0);
        const sc0 = it.scroll > 0.5 ? 0 : 1, sc1 = it.scroll < it.e.textW - textClipWidth(it.e) - 0.5 ? 0 : 1;
        g.addColorStop(0, `rgba(0,0,0,${sc0})`); g.addColorStop(f, '#000'); g.addColorStop(1 - f, '#000'); g.addColorStop(1, `rgba(0,0,0,${sc1})`);
        o.fillStyle = g; o.fillRect(0, 0, clipW + 4, s.h);
      }
      ctx.globalAlpha *= it.textOpacity;
      ctx.drawImage(off, tx0 - 2, s.y, clipW + 4, s.h);
      ctx.restore();
    }
  }
  ctx.restore();
}
function clipOutShapes(shapes) {
  // 逐个求交：结果 = 全幅 − ∪上层外形，下层永不透出上层
  for (const s of shapes) {
    ctx.beginPath(); ctx.rect(-1e4, -1e4, 2e4, 2e4); rrPath(ctx, s.x, s.y, s.w, s.h, s.r); ctx.clip('evenodd');
  }
}
let lastItems = [];
function render() {
  const G = geometry();
  const Z = ui.zoom * devicePixelRatio;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  drawBackdrop(G);
  const pts = drawMainBar(G, material(ui.theme === 'light' && ui.expanded));
  drawRing(G, pts);
  const items = layout(G); lastItems = items;
  const M = material(ui.theme === 'light' && ui.expanded);
  const shapes = items.map(itemShape);
  for (let i = 0; i < items.length; i++) {
    ctx.save();
    clipOutShapes(shapes.slice(i + 1).filter((s, k) => items[i + 1 + k].opacity > 0.05));
    drawItem(items[i], M);
    ctx.restore();
  }
  if (ui.bounds) {
    ctx.setLineDash([4, 3]); ctx.lineWidth = 1 / ui.zoom;
    ctx.strokeStyle = '#4af'; ctx.strokeRect(G.base.l, G.base.t, G.base.r - G.base.l, G.base.b - G.base.t);
    let vb = { ...G.base };
    items.filter(it => it.overflow).map(itemShape).forEach(s => { vb.l = Math.min(vb.l, s.x - 6); vb.t = Math.min(vb.t, s.y - 6); vb.r = Math.max(vb.r, s.x + s.w + 6); vb.b = Math.max(vb.b, s.y + s.h + 6); });
    ctx.strokeStyle = '#f84'; ctx.strokeRect(vb.l, vb.t, vb.r - vb.l, vb.b - vb.t);
    ctx.setLineDash([]);
    ctx.fillStyle = '#4af'; ctx.font = `10px Consolas`; ctx.fillText('原窗口', G.base.l + 2, G.base.b + 12);
    ctx.fillStyle = '#f84'; ctx.fillText('当前视口', vb.l + 2, vb.t - 4);
  }
  document.getElementById('log').textContent = entries.map(e => `${e.id} ${e.phase.padEnd(10)} ${e.text.slice(0, 8)}`).join('\n') + `\n同心弧 ${fan.open ? '展开' : '收起'}`;
}

// ---------- 交互 ----------
function toDip(ev) { const r = canvas.getBoundingClientRect(); return [(ev.clientX - r.left) / ui.zoom, (ev.clientY - r.top) / ui.zoom]; }
function hitTest(x, y) {
  for (let i = lastItems.length - 1; i >= 0; i--) {
    const it = lastItems[i]; if (!it.hit || it.opacity < 0.05) continue;
    const s = itemShape(it); const pad = it.kind === 'tile' && it.hit === 'dock' ? Math.max(0, (24 - s.w) / 2) : 0;
    if (x >= s.x - pad && x <= s.x + s.w + pad && y >= s.y - pad && y <= s.y + s.h + pad) return it;
  }
  return null;
}
canvas.addEventListener('pointermove', ev => { const [x, y] = toDip(ev); const h = hitTest(x, y); pointer.hover = h && h.kind === 'tile' ? h.id : 0; canvas.style.cursor = h ? 'pointer' : 'default'; });
canvas.addEventListener('pointerleave', () => pointer.hover = 0);
canvas.addEventListener('pointerdown', ev => {
  const [x, y] = toDip(ev); const h = hitTest(x, y);
  pointer.down = h ? h.id : 0;
  if (!h && fan.open) closeFan();
});
canvas.addEventListener('pointerup', ev => {
  const [x, y] = toDip(ev); const h = hitTest(x, y); const id = pointer.down; pointer.down = 0;
  if (!h || h.id !== id) return;
  pointer.hover = 0;   // 点击后不移动则没有悬停态
  const e = h.e;
  if (h.hit === 'capsule') { collapse(e); return; }
  if (e.icon === 'barStatusNewVersion' && (h.hit === 'dock' || h.hit === 'fan')) { flash(`跳转：设置 → 软件版本`); if (fan.open) closeFan(); return; }
  const dockedNow = entries.filter(d => d.phase === 'docked');
  if (h.hit === 'dock') {
    if (dockedNow.length === 1) { reexpand(e); return; }
    openFan(); return;
  }
  if (h.hit === 'fan') {
    fan.deadline = now + P.fanAutoClose;
    if (fan.selected === e.id) { e.select.set(0); fan.selected = 0; return; }
    for (const d of entries) d.select.set(0);
    if (fan.selected) { fan.selected = 0; return; }   // 再点其他圆形：收起选中
    e.select.set(1); e.selectStart = now; fan.selected = e.id;
  }
});
function reexpand(e) {
  // 逆向：从停靠位飞回锚点，再展开文字
  e.phase = 'reexpand'; e.reexpandFrom = true; e.holding = true; e.holdStart = now; e.holdEnd = now + P.hold;
  e.flight.x = 1; e.flight.set(0); e.width.jump(P.capH); e.width.set(e.fullW);
  e.slot.jump(0);
}
let flashText = '', flashUntil = 0;
function flash(t) { flashText = t; flashUntil = now + 1.5; }

document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const k = b.dataset.add;
  if (k === 'five') for (let i = 0; i < 5; i++) add('random');
  else if (k === 'fill') while (entries.filter(e => !e.leaving).length < 25) add('random');
  else add(k);
});
document.getElementById('retire').onclick = retireNewest;
document.getElementById('pause').onclick = () => paused = !paused;
document.getElementById('clear').onclick = () => { entries = []; closeFan(); };

function resize() {
  const wrap = document.getElementById('stageWrap');
  canvas.width = wrap.clientWidth * devicePixelRatio; canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width = wrap.clientWidth + 'px'; canvas.style.height = wrap.clientHeight + 'px';
}
window.addEventListener('resize', resize); resize();
let last = performance.now(), paused = false;
if (location.search.includes('bare')) { const sd = document.getElementById('side'); sd.style.display = 'none'; resize(); }
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!paused) advance(dt);
  render();
  if (now < flashUntil) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(20, 20, 220, 30); ctx.fillStyle = '#fff'; ctx.font = `13px ${FONT}`; ctx.fillText(flashText, 30, 40); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
add('ppt');
</script>
