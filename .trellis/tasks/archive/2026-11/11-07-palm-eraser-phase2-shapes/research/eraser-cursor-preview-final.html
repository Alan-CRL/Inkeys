<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Inkeys 橡皮光标 · 方案预览 v4（图标）</title>
<style>
  body { font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
  header { padding: 20px 28px 6px; }
  h1 { font-size: 20px; margin: 0 0 6px; } h2 { font-size: 16px; margin: 0 0 4px; }
  p.note { margin: 4px 0; font-size: 13px; color: #4b5563; line-height: 1.6; }
  .bar { position: sticky; top: 0; z-index: 5; background: #ffffffee; backdrop-filter: blur(6px); border-bottom: 1px solid #e5e7eb;
         padding: 10px 28px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 5px 9px; cursor: pointer; font: inherit; }
  .seg button.on { background: #2563eb; color: #fff; }
  main { padding: 8px 28px 48px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: 90px repeat(6, auto); gap: 6px 10px; align-items: center; margin-top: 8px; }
  .grid .h { font-size: 12px; color: #6b7280; text-align: center; } .grid .rh { font-size: 12px; color: #374151; }
  canvas { display: block; border-radius: 6px; }
  .strip { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: flex-end; }
  .strip figure { margin: 0; font-size: 11px; color: #6b7280; text-align: center; }
  .settings { border-radius: 10px; padding: 16px; margin-top: 10px; max-width: 780px; }
  .settings.light { background: #f3f3f3; color: #1b1b1b; --accent: #005fb8; --line: #d6d6d6; --tile: #fff; --tileHover: #f6f6f6; --tileEdge: #e0e0e0; --cardBg: #fbfbfb; --cardEdge: #e5e5e5; }
  .settings.dark { background: #202020; color: #fff; --accent: #60cdff; --line: #3d3d3d; --tile: #323232; --tileHover: #3a3a3a; --tileEdge: #3c3c3c; --cardBg: #2b2b2b; --cardEdge: #1d1d1d; }
  .scard { border-radius: 8px; padding: 14px 16px; background: var(--cardBg); border: 1px solid var(--cardEdge); }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .stitle { font-size: 14px; } .sdesc { font-size: 12px; opacity: .72; margin-top: 2px; }
  select { font: inherit; padding: 5px 28px 5px 10px; border-radius: 4px; }
  .light select { background: #fff; color: #1b1b1b; border: 1px solid #d0d0d0; }
  .dark select { background: #2d2d2d; color: #fff; border: 1px solid #3d3d3d; }
  .inline { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .picker { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .picker .divider { width: 1px; align-self: stretch; margin: 4px 10px; background: var(--line); }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .opt .tile { width: 72px; height: 72px; border-radius: 8px; display: grid; place-items: center; position: relative; background: var(--tile); box-shadow: inset 0 0 0 1px var(--tileEdge); }
  .opt:hover .tile { background: var(--tileHover); }
  .opt.on .tile::after { content: ""; position: absolute; inset: -3px; border-radius: 10px; border: 2px solid var(--accent); }
  .opt .lbl { font-size: 12px; opacity: .85; } .opt.on .lbl { opacity: 1; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>橡皮光标 v4：Inkeys 图标缩小 + 笔改橡皮风格</h1>
  <p class="note">已定：星光 = 原版 D1；圆角 6 DIP；纹样浅色 207；深色橡皮为反相色调。本页只比较 Inkeys 图标：图标占短边比例从 62% 改为 <b>圆形/正方形 48%、竖长矩形 54%</b>。</p>
  <p class="note">笔改橡皮的四个变体沿原 logo 笔的同一轴线（方向 (0.440, −0.898)、半宽 13.5）绘制，因此能嵌进原屏幕的“笔槽”；屏幕与笔之间统一扣出 6 个 logo 单位的空隙（与原 logo 相同）。浅色：笔/橡皮 RGB 43、屏幕黑 9%；深色：白、屏幕白 22%。</p>
</header>
<div class="bar">
  <span>背景</span><span class="seg" id="bgSeg"></span>
  <span>状态</span><span class="seg" id="stateSeg"></span>
  <span>橡皮明暗</span><span class="seg" id="themeSeg"></span>
  <span>图标比例</span><span class="seg" id="ratioSeg"></span>
</div>
<main id="main"></main>

<script>
const SIZES = [16, 24, 32, 48, 96, 160];
const SHAPES = [ { key: 'circle', name: '圆形' }, { key: 'rect', name: '竖长矩形' }, { key: 'square', name: '正方形' } ];
const BACKGROUNDS = [ { key: 'white', name: '白板' }, { key: 'black', name: '黑板' }, { key: 'ink', name: '墨迹上' }, { key: 'desk', name: '桌面' } ];
const STATES = [ { key: 0.5, name: '悬停 0.5' }, { key: 1.0, name: '接触 1.0' } ];
const THEMES = [ { key: 'light', name: '浅色（默认）' }, { key: 'dark', name: '深色' } ];
const RATIOS = [ { key: 'new', name: '新：48% / 54%' }, { key: 'old', name: '旧：62%' } ];
let bg = 'white', opacity = 0.5, theme = 'light', ratioMode = 'new';
const SCALE = 1.5, CORNER_DIP = 6, OUTLINE_RATIO = 0.04;
const PALETTE = {
  light: { fill: 255, ring: 207, mark: 207, pen: [43, 43, 43], screen: [0, 0, 0, 0.09] },
  dark:  { fill: 40,  ring: 110, mark: 200, pen: [255, 255, 255], screen: [255, 255, 255, 0.22] },
};
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v, cov = d => sat(0.5 - d), len = (x, y) => Math.sqrt(x * x + y * y);

function geometry(shapeKey, diameter) {
  const r = diameter / 2;
  if (shapeKey === 'rect') return { hx: r * 0.7236012546, hy: r * 1.0854018818 };
  if (shapeKey === 'square') return { hx: r * 0.8862269255, hy: r * 0.8862269255 };
  return { hx: r, hy: r, circle: true };
}
function roundRectDist(x, y, hx, hy, c) {
  const qx = Math.abs(x) - (hx - c), qy = Math.abs(y) - (hy - c);
  return len(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - c;
}
function shapeDist(g, x, y) { return g.circle ? len(x, y) - g.hx : roundRectDist(x, y, g.hx, g.hy, Math.min(CORNER_DIP * SCALE, Math.min(g.hx, g.hy))); }
function vCapsule(x, y, r, hh) { const s = Math.max(hh - r, 0); return len(x, y - Math.max(-s, Math.min(s, y))) - r; }
function capsule(px, py, ax, ay, bx, by, r) {
  const pax = px - ax, pay = py - ay, bax = bx - ax, bay = by - ay, h = sat((pax * bax + pay * bay) / (bax * bax + bay * bay));
  return len(pax - bax * h, pay - bay * h) - r;
}
function star(x, y, R, n = 0.5, rf = 0.06) {
  const k = R * rf, rr = R - k, ax = Math.abs(x) + 1e-4, ay = Math.abs(y) + 1e-4;
  const px = Math.pow(ax / rr, n), py = Math.pow(ay / rr, n), u = px + py - 1;
  if (u < -0.35) return -8; if (u > 0.35) return 8;
  return u / Math.max(len(n * px / ax, n * py / ay), 1e-4) - k;
}
const patGrips = (x, y, S) => Math.min(vCapsule(x + 0.12 * S, y, 0.05 * S, 0.24 * S), vCapsule(x - 0.12 * S, y, 0.05 * S, 0.24 * S));
function patD1(x, y, S) {   // 已定：原版 D1
  let d = star(x - 0.15 * S, y + 0.15 * S, 0.12 * S);
  if (S >= 40) d = Math.min(d, star(x - 0.31 * S, y, 0.05 * S));
  return Math.min(d, capsule(x, y, -0.27 * S, 0.17 * S, -0.13 * S, 0.03 * S, 0.026 * S), capsule(x, y, -0.16 * S, 0.26 * S, -0.06 * S, 0.16 * S, 0.026 * S));
}
const SDF = { grips: { fn: patGrips, minS: 0 }, d1: { fn: patD1, minS: 20 } };

// ---------------- Inkeys 图标 ----------------
const SCREEN = [
  'M125.396 177.775H192C195.314 177.775 198 175.089 198 171.775V83.7752C198 80.4615 195.314 77.7752 192 77.7752H179.79L135.09 169.011L125.396 177.775Z',
  'M134.765 81.0459L136.367 77.7752H65C61.6863 77.7752 59 80.4615 59 83.7752V171.775C59 175.089 61.6863 177.775 65 177.775H98.1147L100.073 151.854L134.765 81.0459Z'].map(d => new Path2D(d));
const SVG_PEN = [
  'M142.794 78.5224L143.05 77.9998L150.214 63.3763L150.81 62.1478C151.558 60.6205 152.789 59.4872 154.228 58.8418C156.061 58.0201 158.231 57.9889 160.176 58.9416L171.844 64.6587C173.787 65.6106 175.093 67.3431 175.567 69.2929C175.941 70.8271 175.8 72.4958 175.051 74.0246L174.533 75.0817L173.103 77.9998L167.029 90.3966L142.794 78.5224Z',
  'M140.154 83.9104L164.395 95.7872L131.276 163.383L107.035 151.507L140.154 83.9104Z',
  'M105.679 157.524L127.353 168.142L116.449 178L107.348 186.228L103.623 184.742L104.132 178L105.679 157.524Z',
  'M96.9033 195.5681C96.1087 197.19 96.7794 199.1489 98.4013 199.9434C100.0231 200.7389 101.9821 200.0678 102.7767 198.4458L105.7098 192.4589L99.8369 189.5811L96.9033 195.5681Z'].map(d => new Path2D(d));
// 原笔轴线：笔尖点 N，沿 u 指向笔帽，n 为横向；单位为 logo 单位（256 视口）。
const U = [0.4399, -0.8981], NRM = [0.8981, 0.4399], N0 = [99.28, 198.04];
const AXIS = new DOMMatrix([U[0], U[1], NRM[0], NRM[1], N0[0], N0[1]]);
// 局部 (t 沿轴, s 横向) 图元
function bandPath(t0, t1, hw, r0 = 0, r1 = 0) {        // 矩形段，可让 t0/t1 端为圆角
  const p = new Path2D();
  p.moveTo(t0 + r0, -hw); p.lineTo(t1 - r1, -hw);
  r1 ? p.arcTo(t1, -hw, t1, -hw + r1, r1) : p.lineTo(t1, -hw);
  p.lineTo(t1, hw - r1);
  r1 ? p.arcTo(t1, hw, t1 - r1, hw, r1) : p.lineTo(t1, hw);
  p.lineTo(t0 + r0, hw);
  r0 ? p.arcTo(t0, hw, t0, hw - r0, r0) : p.lineTo(t0, hw);
  p.lineTo(t0, -hw + r0);
  r0 ? p.arcTo(t0, -hw, t0 + r0, -hw, r0) : p.lineTo(t0, -hw);
  p.closePath(); return p;
}
function conePath(t0, t1, hw0, hw1) { const p = new Path2D(); p.moveTo(t0, -hw0); p.lineTo(t1, -hw1); p.lineTo(t1, hw1); p.lineTo(t0, hw0); p.closePath(); return p; }
function wornPath(t0, t1, hw) {
  const p = new Path2D(), cut = 16;
  p.moveTo(t0, -hw); p.lineTo(t1, -hw); p.lineTo(t1, hw); p.lineTo(t0 + cut, hw); p.lineTo(t0, hw - cut * 0.9); p.closePath();
  return p;
}
function toAxis(local) { const p = new Path2D(); p.addPath(local, AXIS); return p; }
// 每个变体返回若干“同色部件”；部件之间留细缝以表达分段（纯色仍可辨认结构）。
const PEN_VARIANTS = {
  logo: { name: 'L-a 原图标（缩小）', parts: () => SVG_PEN },
  eraserTop: { name: 'L-b 带橡皮头的铅笔（笔帽→金属箍 + 橡皮）', parts: () => [
    conePath(0, 44, 0.8, 13.5), bandPath(44, 118, 13.5),
    bandPath(120.5, 129.5, 14.8), bandPath(132, 151, 13.5, 0, 6)].map(toAxis) },
  eraserDown: { name: 'L-c 倒置铅笔（橡皮端朝下“擦”屏幕）', parts: () => [
    bandPath(0, 21, 13, 6, 0), bandPath(23.5, 32.5, 14.3), bandPath(35, 112, 13.5),
    conePath(114, 151, 13.5, 0.8)].map(toAxis) },
  block: { name: 'L-d 方块橡皮（橡皮体 + 纸套）', parts: () => [
    bandPath(14, 66, 14, 5, 0), bandPath(68.5, 150, 14, 0, 5)].map(toAxis) },
  block1: { name: 'L-d 下移 4', parts: () => [
    bandPath(10, 62, 14, 5, 0), bandPath(64.5, 146, 14, 0, 5)].map(toAxis) },
  block2: { name: 'L-d 下移 5（竖直居中）', parts: () => [
    bandPath(9, 61, 14, 5, 0), bandPath(63.5, 145, 14, 0, 5)].map(toAxis) },
  block3: { name: 'L-d 下移 6', parts: () => [
    bandPath(8, 60, 14, 5, 0), bandPath(62.5, 144, 14, 0, 5)].map(toAxis) },
};

function drawLogo(ctx, variant, pal, op, S, shapeKey, cx, cy, dpr) {
  const ratio = ratioMode === 'old' ? 0.62 : (shapeKey === 'rect' ? 0.54 : 0.48);
  const k = ratio * S / 142;
  const size = Math.ceil(S * 1.2) + 4;
  // 先在离屏画布合成“屏幕 − 笔外扩空隙 + 笔”，再整体以 op 叠加，避免半透明分层叠色。
  const off = document.createElement('canvas'); off.width = off.height = size;
  const o = off.getContext('2d');
  o.translate(size / 2, size / 2); o.scale(k, k); o.translate(-128.5, -129);
  const parts = PEN_VARIANTS[variant].parts();
  const [sr, sg, sb, sa] = pal.screen;
  o.fillStyle = `rgba(${sr},${sg},${sb},${sa})`;
  // 原图标用自带笔槽的屏幕路径；新笔形改用完整屏幕圆角矩形，再按新形状扣空隙，避免残留旧笔槽。
  if (variant === 'logo') for (const p of SCREEN) o.fill(p);
  else { const full = new Path2D(); full.roundRect(59, 77.775, 139, 100, 6); o.fill(full); }
  if (variant !== 'logo') {
    // 原屏幕路径已含原笔槽；新笔形状再扣一次 6 单位空隙，保证与屏幕分离。
    o.globalCompositeOperation = 'destination-out';
    o.lineWidth = 12; o.lineJoin = 'round'; o.strokeStyle = '#000'; o.fillStyle = '#000';
    for (const p of parts) { o.fill(p); o.stroke(p); }
    o.globalCompositeOperation = 'source-over';
  }
  o.fillStyle = `rgb(${pal.pen.join(',')})`; for (const p of parts) o.fill(p);
  ctx.save(); ctx.globalAlpha = op; ctx.drawImage(off, cx - size / 2, cy - size / 2); ctx.restore();
}

function paintBg(ctx, w, h, key) {
  const solid = { white: '#fff', black: '#1e2a24', tileLight: '#fff', tileDark: '#323232' }[key];
  if (solid) { ctx.fillStyle = solid; ctx.fillRect(0, 0, w, h); return; }
  if (key === 'ink') {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.lineCap = 'round';
    for (const [c, t] of [['#e11d48', .18], ['#111827', .5], ['#2563eb', .8]]) {
      ctx.strokeStyle = c; ctx.lineWidth = Math.max(3, h * .09); ctx.beginPath();
      ctx.moveTo(-4, h * t + h * .15); ctx.bezierCurveTo(w * .3, h * t - h * .2, w * .7, h * t + h * .25, w + 4, h * t - h * .1); ctx.stroke();
    }
    return;
  }
  const gr = ctx.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#1d4f8f'); gr.addColorStop(1, '#6fb1e6');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#f9fafb'; ctx.fillRect(w * .45, h * .1, w * .6, h * .55);
}

function tile(patKey, shapeKey, diameter, bgKey, op, themeKey, fixed) {
  const pal = PALETTE[themeKey], g = geometry(shapeKey, diameter), S = 2 * Math.min(g.hx, g.hy);
  const dpr = window.devicePixelRatio || 1;
  const w = fixed ? Math.round(fixed * dpr) : Math.ceil(2 * Math.max(g.hx, 22) + 20);
  const h = fixed ? Math.round(fixed * dpr) : Math.ceil(2 * Math.max(g.hy, 22) + 20);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.style.width = (w / dpr) + 'px'; cv.style.height = (h / dpr) + 'px';
  const ctx = cv.getContext('2d'); paintBg(ctx, w, h, bgKey);
  const img = ctx.getImageData(0, 0, w, h), px = img.data, cx = w / 2, cy = h / 2;
  const sdf = SDF[patKey], fill = pal.fill / 255, ring = pal.ring / 255, mark = pal.mark / 255;
  for (let j = 0; j < h; ++j) for (let i = 0; i < w; ++i) {
    const x = i + .5 - cx, y = j + .5 - cy, d = shapeDist(g, x, y), outer = cov(d); if (outer <= 0) continue;
    const inner = cov(d + S * OUTLINE_RATIO), ringA = Math.max(0, outer - inner) * op, fillA = inner * op;
    let a = ringA + fillA, c = (ringA * ring + fillA * fill) / a;
    if (sdf && S >= sdf.minS) { const m = Math.min(cov(sdf.fn(x, y, S)), inner); if (m > 0) { c += m * ((patKey === 'grips' ? ring : mark) - c); a += m * (op - a); } }
    const o = (j * w + i) * 4; for (let k = 0; k < 3; ++k) px[o + k] = c * 255 * a + px[o + k] * (1 - a);
  }
  ctx.putImageData(img, 0, 0);
  if (PEN_VARIANTS[patKey] && S >= 24) drawLogo(ctx, patKey, pal, op, S, shapeKey, cx, cy, dpr);
  return cv;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function variantCard(key, desc, tagText) {
  const card = el('section', 'card'), h = el('h2', null, PEN_VARIANTS[key].name);
  if (tagText) h.appendChild(el('span', 'tag', tagText));
  card.append(h, el('p', 'note', desc));
  const grid = el('div', 'grid'); grid.appendChild(el('div', 'h', ''));
  for (const s of SIZES) grid.appendChild(el('div', 'h', s + ' px'));
  for (const sh of SHAPES) { grid.appendChild(el('div', 'rh', sh.name)); for (const s of SIZES) grid.appendChild(tile(key, sh.key, s, bg, opacity, theme)); }
  card.appendChild(grid);
  const strip = el('div', 'strip');
  for (const th of THEMES) for (const sh of SHAPES) for (const b of ['white', 'black']) {
    const f = el('figure'); f.appendChild(tile(key, sh.key, 96, b, 1.0, th.key));
    f.appendChild(el('figcaption', null, `${th.key === 'light' ? '浅色' : '深色'} · ${sh.name} · ${b === 'white' ? '白板' : '黑板'}`)); strip.appendChild(f);
  }
  card.appendChild(strip); return card;
}

const ui = { shape: 'circle', pattern: 'logo', logo: 'block2', eraserTheme: 'light' };
const resolve = p => p === 'logo' ? ui.logo : p;
function opt(on, canvas, label, onclick) { const o = el('div', 'opt' + (on ? ' on' : '')), t = el('div', 'tile'); t.appendChild(canvas); o.append(t, el('div', 'lbl', label)); o.onclick = onclick; return o; }
function pickerCard() {
  const card = el('section', 'card');
  card.append(el('h2', null, '光标页“橡皮光标”内联块（第二个纹样用下方所选图标变体）'));
  const ctrl = el('div', 'bar'); Object.assign(ctrl.style, { position: 'static', padding: '6px 0', border: '0', background: 'transparent' });
  ctrl.appendChild(el('span', null, '图标变体')); const sg = el('span', 'seg');
  for (const k of Object.keys(PEN_VARIANTS)) { const b = el('button', ui.logo === k ? 'on' : '', PEN_VARIANTS[k].name.split(' ')[0]); b.onclick = () => { ui.logo = k; render(); }; sg.appendChild(b); }
  ctrl.appendChild(sg); card.appendChild(ctrl);
  for (const appTheme of ['light', 'dark']) {
    const wrap = el('div', 'settings ' + appTheme), sc = el('div', 'scard'), head = el('div', 'srow'), left = el('div');
    left.append(el('div', 'stitle', '橡皮光标'), el('div', 'sdesc', '形状同时决定实际擦除区域（矩形为直角）；纹样与明暗仅影响光标外观。'));
    const sel = el('select'); for (const t of THEMES) { const o = el('option', null, t.key === 'light' ? '浅色' : '深色'); o.value = t.key; o.selected = t.key === ui.eraserTheme; sel.appendChild(o); }
    sel.onchange = () => { ui.eraserTheme = sel.value; render(); };
    head.append(left, sel); sc.appendChild(head);
    const inline = el('div', 'inline'), row = el('div', 'picker'), bgKey = appTheme === 'light' ? 'tileLight' : 'tileDark';
    const sz = s => s === 'rect' ? 50 : 54;
    for (const sh of SHAPES) row.appendChild(opt(ui.shape === sh.key, tile(resolve(ui.pattern), sh.key, sz(sh.key), bgKey, 1, ui.eraserTheme, 64), sh.name, () => { ui.shape = sh.key; render(); }));
    row.appendChild(el('div', 'divider'));
    for (const [p, label] of [['grips', '经典'], ['logo', 'Inkeys'], ['d1', '星光']])
      row.appendChild(opt(ui.pattern === p, tile(resolve(p), ui.shape, sz(ui.shape), bgKey, 1, ui.eraserTheme, 64), label, () => { ui.pattern = p; render(); }));
    inline.appendChild(row); sc.appendChild(inline); wrap.appendChild(sc); card.appendChild(wrap);
  }
  return card;
}

function render() {
  const m = document.getElementById('main'); m.innerHTML = '';
  m.appendChild(variantCard('block', '原 L-d：方块中心在笔轴 t≈82，屏幕中心在 t≈76，方块整体偏上约 6 个 logo 单位。', '原位置'));
  m.appendChild(variantCard('block1', '沿笔轴向左下移 4 个 logo 单位（竖直中心 ≈128.0，比居中略高一点），形状、长度、纸套比例不变。', '候选'));
  m.appendChild(variantCard('block2', '沿笔轴向左下移 5：整个图标的竖直中心 ≈128.9，与光标中心（129）对齐。', '候选 · 推荐'));
  m.appendChild(variantCard('block3', '沿笔轴向左下移 6：竖直中心 ≈129.8，比居中略低一点。', '候选'));
  m.appendChild(pickerCard());
}
function seg(id, items, get, set) {
  const s = document.getElementById(id);
  for (const it of items) { const b = el('button', get() === it.key ? 'on' : '', it.name); b.onclick = () => { set(it.key); [...s.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); render(); }; s.appendChild(b); }
}
seg('bgSeg', BACKGROUNDS, () => bg, v => bg = v);
seg('stateSeg', STATES, () => opacity, v => opacity = v);
seg('themeSeg', THEMES, () => theme, v => theme = v);
seg('ratioSeg', RATIOS, () => ratioMode, v => ratioMode = v);
render();
</script>
