ry .entry-text{flex:1}.home-entry .entry-text p{font-size:12px;color:var(--secondary);margin-top:2px}.home-entry .arrow{font-size:12px;width:12px}.author{padding:16px;border:1px solid var(--stroke);border-radius:4px;min-height:121px;background:white}.author-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.author-avatar{width:36px;height:36px;background:#f0f0f0;border-radius:50%;display:flex;align-items:center;justify-content:center}.author p{font-size:12px;color:var(--secondary)}.author-links{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}.home-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#757575;margin-top:20px}.home-foot .version-link{margin-left:auto}.home-foot button{font-size:12px}.sample-note{margin-top:24px;padding:16px;border:1px solid var(--stroke);border-radius:4px;color:var(--secondary);background:#fff}.breadcrumbs{display:flex;align-items:center;gap:12px;margin-bottom:24px}.breadcrumbs .glyph{font-size:14px}.breadcrumbs button{background:transparent;color:var(--secondary);font-size:28px;line-height:36px;padding:0}.veil{display:none}.toast{position:fixed;bottom:24px;left:calc(50% + 64px);transform:translateX(-50%);max-width:calc(100vw - 64px);padding:12px 18px;background:#fff;border:1px solid #d8d8d8;border-radius:8px;box-shadow:0 8px 32px #0002;z-index:20}.toast[hidden]{display:none}

<body>
<header class="titlebar"><img class="app-icon" src="../../../../Inkeys/src/icon.ico" alt=""><span>智绘教 Inkeys</span><div class="caption" aria-hidden="true"><div class="preview-label">设计审查稿 · 示例状态</div><span>—</span><span>□</span><span>×</span></div></header>
<div class="app" id="app">
<aside class="pane" aria-label="设置导航">
<div class="pane-top"><button class="menu" id="menu" aria-label="收起导航" aria-expanded="true"><span class="glyph" aria-hidden="true">&#xE700;</span></button><span class="pane-title">设置</span></div>
<nav class="nav-scroll" id="nav"></nav>
<div class="nav-footer" id="footer"></div>
</aside>
<button class="veil" id="veil" aria-label="关闭导航遮罩"></button>
<main class="content" id="content"><div class="page" id="page"></div></main>
</div>
<div role="status" class="toast" id="toast" hidden></div>
<script>
// 审查稿仅演示导航与控件状态，不连接产品配置或执行系统操作。
const $=id=>document.getElementById(id), app=$('app');
const icon=(code,extra='')=>`<span class="glyph ${extra}" aria-hidden="true">&#x${code};</span>`;
const entries=[['home','主页','E80F'],['general','常规','E713'],['draw','绘制','EDC6'],['preset','预设','F259'],['plugins','插件','EA86'],['component','组件','E74C'],['hotkey','快捷键','E765'],['language','语言','E774'],['config','配置保存','E8B7'],['version','软件版本','E946'],['experimental','实验选项','EC4A'],['sponsor','支持开发','E734'],['debug','调试','E90F']];
const navButton=([id,title,glyph])=>`<button class="nav-item" data-page="${id}" aria-label="${title}" title="${title}">${icon(glyph)}<span class="nav-label">${title}</span></button>`;
$('nav').innerHTML=entries.slice(0,1).map(navButton).join('')+'<div class="nav-caption">偏好设置</div>'+entries.slice(1,9).map(navButton).join('')+'<div class="nav-caption">支持与维护</div>'+entries.slice(9).map(navButton).join('');
$('footer').innerHTML=[['community','交流社区','E716'],['restart','重启软件','E72C'],['exit','退出软件','E711']].map(([id,title,glyph])=>`<button class="nav-item" data-demo="${title}" aria-label="${title}" title="${title}">${icon(glyph)}<span class="nav-label">${title}</span></button>`).join('');
let current='general', userCompact=null;
function updatePane(){const auto=window.innerWidth<900, compact=auto?true:(userCompact===null?false:userCompact);app.classList.toggle('compact',compact);if(!compact)app.classList.remove('overlay');const open=!compact||app.classList.contains('overlay');$('menu').setAttribute('aria-expanded',String(open));$('menu').setAttribute('aria-label',open?'收起导航':'展开导航')}
$('menu').onclick=()=>{if(window.innerWidth<900){app.classList.toggle('overlay')}else{userCompact=!app.classList.contains('compact');app.classList.remove('overlay')}updatePane()};
$('veil').onclick=()=>{app.classList.remove('overlay');updatePane()};
window.addEventListener('resize',()=>{app.classList.remove('overlay');updatePane()});
const toggle=(label,on=true)=>`<div class="switch-line"><span>${on?'开':'关'}</span><button class="switch" role="switch" aria-label="${label}" aria-checked="${on}"></button></div>`;
const btn=(text,kind='')=>`<button class="btn ${kind}" data-demo="${text}">${text}</button>`;
const slider=(label,val,min,max)=>`<div class="slider-line"><output>${val}%</output><input class="slider" aria-label="${label}" type="range" min="${min}" max="${max}" value="${val}" step="1" style="background:linear-gradient(to right,var(--accent) ${(val-min)/(max-min)*100}%,#8a8a8a ${(val-min)/(max-min)*100}%)"></div>`;
const select=(label,items)=>`<select class="select" aria-label="${label}">${items.map(t=>`<option>${t}</option>`).join('')}</select>`;
const row=(glyph,title,desc,action)=>`<div class="row">${icon(glyph)}<div class="row-copy"><div>${title}</div>${desc?`<p>${desc}</p>`:''}</div><div class="row-action">${action}</div></div>`;
const section=(title,rows)=>`<section class="section"><h2 class="section-title">${title}</h2><div class="rows">${rows}</div></section>`;
const general=()=>`<h1>常规</h1><p class="page-sub">启动方式、界面大小与日常使用偏好。</p>${section('启动',row('E7E8','开机自动启动','登录当前 Windows 账户时启动 Inkeys。',toggle('开机自动启动'))+row('E71B','桌面快捷方式','在桌面创建 Inkeys 的快捷入口。',btn('更多选项')+btn('创建')))}${section('外观',row('E9A6','主栏 UI 缩放','调整主栏与按钮大小，修改后即时预览。',slider('主栏 UI 缩放',100,50,200))+row('E8A9','设置界面 UI 缩放','调整设置中的文字和控件大小。',slider('设置界面 UI 缩放',100,100,200))+row('E706','启用边缘光影','为主栏保留轻柔的边缘光影效果。',toggle('启用边缘光影')))}${section('使用行为',`<details class="detail"><summary class="row">${icon('E922')}<div class="row-copy"><div>置顶间隔</div><p>控制非绘制状态下的窗口置顶频率。</p></div><div class="row-action"><span class="muted">中等 · 3 秒</span>${icon('E70D','chevron')}</div></summary><div class="detail-body"><p>在非绘制模式下按此间隔置顶窗口，落笔时暂停。更短的间隔可减少其他软件干扰，但会占用更多 CPU 资源。</p><p>如果其他软件持续干扰，可使用「插件 → 超级置顶」。</p><p>${select('置顶间隔',['中等（3 秒）','非常短（100 毫秒）','短（500 毫秒）','较短（1 秒）','较长（5 秒）','长（10 秒）','非常长（30 秒）'])}</p></div></details>`+row('E8B2','右键点击主图标关闭程序','退出前显示确认提示。',toggle('右键点击主图标关闭程序',false)))}${section('兼容性',row('E7F4','避免全屏显示','需要重启软件。非绘制与穿透模式下避免占满屏幕。',toggle('避免全屏显示',false))+row('E72E','教学安全选项','选择程序发生崩溃后的处理方式。',select('教学安全选项',['弹窗提示并重启软件','静默重启软件','交由系统崩溃过滤器处理','直接关闭软件'])))}<div class="info">${icon('E946')}<div>以上为布局与示例状态。控件交互只在此审查稿中生效。</div></div>`;
const art=`<svg class="hero-art" viewBox="0 0 310 212" fill="none" aria-label="书写与讲解插画" role="img"><circle cx="216" cy="71" r="110" fill="#DCEAF7"/><circle cx="279" cy="206" r="62" fill="#F4E8DC"/><rect x="34" y="40" width="239" height="141" rx="8" fill="#FFFFFF" stroke="#C5D8E7"/><path d="M58 68H110M58 78H89" stroke="#BDCCD6" stroke-width="3" stroke-linecap="round"/><path d="M58 151H179M76 154V98" stroke="#8DA8BD" stroke-width="1.5" stroke-linecap="round"/><path d="M82 136C100 136 103 102 120 110C137 118 133 139 156 123C166 116 171 102 178 94" stroke="#1677BD" stroke-width="3" stroke-linecap="round"/><path d="M197 80L235 116H187L197 80Z" stroke="#BF946B" stroke-width="2" stroke-linejoin="round"/><circle cx="204" cy="103" r="26" stroke="#B7CCE0" stroke-dasharray="3 4"/><rect x="113" y="166" width="166" height="31" rx="15.5" fill="white" stroke="#C6D6E3"/><circle cx="134" cy="181" r="8" fill="#E2F0FC"/><path d="M130 184L132 178L138 176L135 182L130 184Z" fill="#1677BD"/><path d="M158 176L165 183L161 187L154 180L158 176Z" stroke="#7D8790"/><path d="M186 177V185M182 181H190" stroke="#7D8790" stroke-linecap="round"/><circle cx="214" cy="181" r="4" fill="#237DB8"/><circle cx="232" cy="181" r="4" fill="#D29A65"/><circle cx="250" cy="181" r="4" fill="#77A38E"/></svg>`;
const feature=(id,title,description,glyph)=>`<button class="feature" data-page="${id}"><div class="feature-art">${icon(glyph)}</div><div class="feature-copy"><strong>${title}</strong><p>${description}</p>${icon('E76C')}</div></button>`;
const home=()=>`<h1>主页</h1><p class="page-sub">欢迎使用智绘教 Inkeys。</p><section class="hero"><div class="hero-copy"><div class="hero-eyebrow">智绘教 INKEYS</div><h2>让每一次讲解，更清晰。</h2><p>书写、标注与演示，都在手边。</p><div class="hero-actions"><button class="btn accent" data-page="draw">调整书写体验</button><button class="btn link" data-demo="使用教程">使用教程 ↗</button></div></div>${art}</section><section class="section"><h2 class="section-title">探索你的工具</h2><div class="home-grid">${feature('draw','绘制','笔迹、橡皮与智能绘图','EDC6')}${feature('preset','预设','常用画笔，随时取用','F259')}${feature('plugins','插件','连接演示与课堂工具','EA86')}</div></section><div class="home-bottom"><section><h2>常用设置</h2><div class="home-list"><button class="home-entry" data-page="general">${icon('E713')}<div class="entry-text">常规<p>启动行为与界面缩放</p></div>${icon('E76C','arrow')}</button><button class="home-entry" data-page="language">${icon('E774')}<div class="entry-text">显示语言<p>简体中文</p></div>${icon('E76C','arrow')}</button></div></section><section><h2>一起完善 Inkeys</h2><div class="author"><div class="author-top"><div class="author-avatar">${icon('E77B')}</div><div>AlanCRL<p>智绘教 Inkeys 创始开发者</p></div></div><div class="author-links"><button class="btn link" data-demo="联系作者">联系作者 ↗</button><button class="btn link" data-demo="反馈建议">反馈建议 ↗</button><button class="btn link" data-page="sponsor">支持开发</button></div></div></section></div><footer class="home-foot"><button class="btn link" data-demo="官方网站">官方网站 ↗</button><button class="btn link" data-demo="GitHub">GitHub ↗</button><button class="btn link" data-demo="交流社区">交流社区 ↗</button><button class="btn link" data-demo="Bilibili">Bilibili ↗</button><span class="version-link">Inkeys 3 · 预览版</span></footer>`;
const language=()=>`<h1>语言</h1><p class="page-sub">选择设置界面使用的语言。</p>${section('显示语言',row('E774','界面语言','切换语言后，按照现有流程提示重启。',select('界面语言',['简体中文','繁體中文','English'])))}<section class="section"><h2>文字预览</h2><div class="sample-note"><p class="language-sample">设置，让每一次书写更顺手。</p><p class="language-sample">Inkeys · Aa Bb Gg Pp Qq 0123456789</p><p>中文、拉丁字母与数字共享稳定行高；图标单独居中。</p></div></section>`;
const plugins=()=>`<h1>插件</h1><p class="page-sub">为演示、窗口管理与课堂操作扩展能力。</p>${section('已集成的工具',row('E8A5','PPT 联动','调整放映控制、页码显示与批注行为。','<button class="btn" data-page="ppt">插件选项</button>')+row('E922','超级置顶','管理窗口置顶辅助行为。',btn('插件选项'))+row('E71B','快捷方式管理','创建和管理 Inkeys 的快捷方式。',btn('插件选项')))}<div class="info">${icon('E946')}<div>此页展示插件列表布局。实际插件版本与状态在接入后从原有服务读取。</div></div>`;
const ppt=()=>`<div class="breadcrumbs"><button data-page="plugins">插件</button>${icon('E76C')}<h1>PPT 联动</h1></div><div class="sample-note">子页面采用相同的标题、设置行与右侧操作列。此审查稿只确认子页导航层级，具体设置项按现有页面逐项迁移。</div>`;
function showPage(id){current=id;const renders={home,general,language,plugins,ppt};$('page').innerHTML=renders[id]?renders[id]():`<h1>${entries.find(e=>e[0]===id)?.[1]||'设置'}</h1><div class="sample-note">该页的功能与配置保留。本轮效果稿先完整展示「主页」「常规」「语言」和插件导航；此入口用于核对侧栏顺序与选中状态。</div>`;document.querySelectorAll('[data-page]').forEach(b=>{if(b.classList.contains('nav-item')){b.classList.toggle('active',b.dataset.page===id||(id==='ppt'&&b.dataset.page==='plugins'));if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});$('content').scrollTop=0;app.classList.remove('overlay');updatePane();history.replaceState(null,'','#'+id)}
let toastTimer;function notify(text){$('toast').textContent='审查演示：'+text+'，未执行实际操作。';$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2200)}
document.addEventListener('click',e=>{const route=e.target.closest('[data-page]');if(route){showPage(route.dataset.page);return}const sw=e.target.closest('.switch');if(sw){const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));sw.previousElementSibling.textContent=on?'开':'关';return}const demo=e.target.closest('[data-demo]');if(demo)notify(demo.dataset.demo)});
document.addEventListener('input',e=>{if(e.target.matches('.slider')){const t=e.target;t.previousElementSibling.value=t.value+'%';const pct=(+t.value-t.min)/(t.max-t.min)*100;t.style.background=`linear-gradient(to right,var(--accent) ${pct}%,#8a8a8a ${pct}%)`}});
document.addEventListener('change',e=>{if(e.target.matches('select[aria-label="置顶间隔"]')){e.target.closest('details').querySelector('summary .muted').textContent=e.target.selectedOptions[0].textContent}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){app.classList.remove('overlay');updatePane()}});
showPage(location.hash.slice(1)||'general');
</script>
</body>
</html>
